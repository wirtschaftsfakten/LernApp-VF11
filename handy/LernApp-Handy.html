<title>LernApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* LernApp – Collegeblock & Textmarker */
:root {
  --paper: #FAFBFD;
  --sheet: #FFFFFF;
  --grid: #E6ECF5;
  --rule: #CBD5E6;
  --ink: #1A2550;
  --ink-2: #4B567A;
  --ink-3: #7480A0;
  --blue: #2B47C9;
  --blue-press: #2139A8;
  --red: #D3263A;
  --ok: #16865A;
  --m-gelb: #FFE45C;
  --m-gruen: #8EF0A8;
  --m-pink: #FF9FCF;
  --m-blau: #9CC9FF;
  --m-orange: #FFB86B;
  --m-lila: #BDB4FF;
  --mark-a: .75;
  --shadow: 0 1px 0 rgba(26, 37, 80, .06), 0 6px 18px -10px rgba(26, 37, 80, .25);
  --radius-s: 6px;
  --radius-m: 10px;
  --font-ui: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --font-hand: 'Caveat', 'Segoe Print', 'Comic Sans MS', cursive;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121A33; --sheet: #18213F; --grid: #1D2748; --rule: #2E3A63;
    --ink: #EEF1FA; --ink-2: #B9C1DA; --ink-3: #8A94B4;
    --blue: #8FA6FF; --blue-press: #A9BAFF; --red: #FF6B7A; --ok: #5BD69B;
    --mark-a: .45;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 24px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121A33; --sheet: #18213F; --grid: #1D2748; --rule: #2E3A63;
  --ink: #EEF1FA; --ink-2: #B9C1DA; --ink-3: #8A94B4;
  --blue: #8FA6FF; --blue-press: #A9BAFF; --red: #FF6B7A; --ok: #5BD69B;
  --mark-a: .45;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 24px -12px rgba(0,0,0,.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 20px 20px;
  color: var(--ink);
  font: 17px/1.55 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--font-ui); line-height: 1.15; margin: 0; letter-spacing: -.01em; }
h1 { font-size: clamp(1.9rem, 4vw, 2.7rem); font-weight: 750; }
h2 { font-size: 1.45rem; font-weight: 700; }
h3 { font-size: 1.12rem; font-weight: 650; }
p { margin: 0; }
a { color: var(--blue); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 4px; }
.skip { position: absolute; left: -999px; }
.skip:focus { left: 12px; top: 12px; z-index: 99; background: var(--sheet); padding: 8px 12px; }
.muted { color: var(--ink-2); }
.small { font-size: .88rem; }
.hand { font-family: var(--font-hand); font-weight: 700; }

/* Textmarker */
.mk { --c: var(--m-gelb); background: linear-gradient(transparent 12%, color-mix(in srgb, var(--c) calc(var(--mark-a) * 100%), transparent) 12%, color-mix(in srgb, var(--c) calc(var(--mark-a) * 100%), transparent) 88%, transparent 88%); border-radius: 3px 8px 4px 9px; padding: 0 .15em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
[data-c="gelb"] { --c: var(--m-gelb); } [data-c="gruen"] { --c: var(--m-gruen); } [data-c="pink"] { --c: var(--m-pink); }
[data-c="blau"] { --c: var(--m-blau); } [data-c="orange"] { --c: var(--m-orange); } [data-c="lila"] { --c: var(--m-lila); }

/* Shell */
.shell { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100vh; }
.rail {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: var(--sheet); border-right: 1px solid var(--rule);
  padding: 22px 0 22px 0; display: flex; flex-direction: column; gap: 4px;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 22px 18px; text-decoration: none; color: var(--ink); }
.brand svg { flex: none; }
.brand b { font: 800 1.35rem/1 var(--font-ui); letter-spacing: -.02em; }
.rail-head { padding: 14px 22px 6px; font: 600 .82rem var(--font-ui); color: var(--ink-3); }
.rail a.nav {
  position: relative; display: flex; align-items: center; gap: 10px;
  padding: 8px 22px 8px 30px; color: var(--ink); text-decoration: none; font-family: var(--font-ui); font-weight: 520;
}
.rail a.nav::before { content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 16px; border-radius: 0 6px 6px 0; background: var(--c, var(--rule)); }
.rail a.nav:hover { background: var(--paper); }
.rail a.nav[aria-current="page"] { background: var(--paper); font-weight: 700; }
.rail a.nav[aria-current="page"]::before { width: 22px; }
.rail a.nav .count { margin-left: auto; font-size: .8rem; color: var(--ink-3); }
.rail .spacer { flex: 1; }
.rail .add-subject { margin: 6px 22px; }
.menu-btn { display: none; }

main { padding: 36px clamp(16px, 4vw, 56px) 80px; max-width: 1100px; width: 100%; outline: none; }

/* Buttons & Inputs */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 42px; padding: 8px 18px; border-radius: var(--radius-s);
  border: 1.5px solid var(--ink); background: var(--sheet); color: var(--ink);
  font: 650 .97rem var(--font-ui); cursor: pointer; text-decoration: none; white-space: nowrap;
  box-shadow: 0 2px 0 var(--ink);
  transition: transform .08s, box-shadow .08s;
}
.btn:hover { background: var(--paper); }
.btn:active { transform: translateY(2px); box-shadow: 0 0 0 var(--ink); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: 0 2px 0 var(--blue-press); }
:root[data-theme="dark"] .btn.primary { color: #0F1530; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0F1530; } }
.btn.primary:hover { filter: brightness(1.06); background: var(--blue); }
.btn.ghost { border-color: transparent; box-shadow: none; background: transparent; color: var(--blue); padding-inline: 10px; }
.btn.ghost:hover { background: color-mix(in srgb, var(--blue) 8%, transparent); }
.btn.danger { color: var(--red); border-color: var(--red); box-shadow: 0 2px 0 var(--red); }
.btn.small { min-height: 34px; padding: 4px 12px; font-size: .88rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.stack { display: grid; gap: 14px; }

label.field { display: grid; gap: 6px; font: 600 .92rem var(--font-ui); }
input[type="text"], input[type="date"], input[type="number"], input[type="search"], select, textarea {
  width: 100%; padding: 10px 12px; border-radius: var(--radius-s);
  border: 1.5px solid var(--rule); background: var(--sheet); font-family: var(--font-body); font-size: 1rem;
}
input:focus, select:focus, textarea:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 22%, transparent); }
textarea { min-height: 140px; resize: vertical; line-height: 1.5; }

/* Seitenkopf */
.page-head { display: grid; gap: 10px; margin-bottom: 28px; }
.crumbs { font: 500 .9rem var(--font-ui); color: var(--ink-3); }
.crumbs a { color: var(--ink-2); text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
.head-row { display: flex; gap: 16px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
.margin-note { font-family: var(--font-hand); font-size: 1.6rem; color: var(--red); line-height: 1; transform: rotate(-2deg); display: inline-block; }
.margin-note.blue { color: var(--blue); }

/* Blätter (Flächen) */
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius-m); box-shadow: var(--shadow); }
.pad { padding: 22px; }
section + section { margin-top: 36px; }
.section-title { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; }

/* Übersicht */
.today { display: grid; grid-template-columns: 1.3fr 1fr; gap: 22px; align-items: stretch; }
.agenda { padding: 6px 0; }
.agenda li { list-style: none; display: grid; grid-template-columns: 76px 1fr auto; gap: 14px; align-items: center; padding: 12px 22px; border-top: 1px dashed var(--rule); }
.agenda li:first-child { border-top: 0; }
.agenda ul { margin: 0; padding: 0; }
.date-chip { text-align: center; line-height: 1.05; font-family: var(--font-ui); }
.date-chip b { display: block; font-size: 1.6rem; font-weight: 800; }
.date-chip span { font-size: .8rem; color: var(--ink-2); }
.agenda a { color: var(--ink); text-decoration: none; font-weight: 700; }
.agenda a:hover { text-decoration: underline; }
.due-box { padding: 22px; display: grid; gap: 14px; align-content: start; }
.due-num { font: 800 3.4rem/1 var(--font-ui); letter-spacing: -.03em; }
.subjects { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
.subject-tile { position: relative; display: grid; gap: 6px; padding: 20px 20px 18px 20px; text-decoration: none; color: var(--ink); overflow: hidden; }
.subject-tile::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 8px; background: var(--c); }
.subject-tile h3 { font-size: 1.2rem; }
.subject-tile:hover { border-color: var(--ink-3); }
.bar { height: 8px; border-radius: 99px; background: var(--grid); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); border-radius: inherit; }

/* Fach-Seite: Tests */
.tests { display: grid; gap: 14px; }
.test-row { display: grid; grid-template-columns: 1fr auto; gap: 8px 18px; align-items: center; padding: 18px 22px; text-decoration: none; color: var(--ink); }
.test-row:hover { border-color: var(--ink-3); }
.test-row .meta { color: var(--ink-2); font-size: .92rem; }

/* Tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1.5px solid var(--rule); margin-bottom: 26px; overflow-x: auto; scrollbar-width: none; }
.tabs a { padding: 10px 14px; text-decoration: none; color: var(--ink-2); font: 600 .97rem var(--font-ui); border-bottom: 3px solid transparent; margin-bottom: -1.5px; white-space: nowrap; }
.tabs a[aria-current="page"] { color: var(--ink); border-color: var(--ink); }
.tabs a:hover { color: var(--ink); }

/* Lernmodi */
.modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.mode { display: grid; grid-template-rows: auto auto 1fr auto; gap: 6px; padding: 18px 20px; text-align: left; cursor: pointer; text-decoration: none; color: var(--ink); }
.mode:hover { border-color: var(--ink-3); }
.mode .ico { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 8px; background: color-mix(in srgb, var(--c) calc(var(--mark-a) * 100%), transparent); margin-bottom: 6px; }
.mode .ico svg { width: 24px; height: 24px; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.mode p { color: var(--ink-2); font-size: .93rem; }
.mode .n { font: 600 .85rem var(--font-ui); color: var(--ink-3); margin-top: 8px; }
.mode[aria-disabled="true"] { opacity: .5; pointer-events: none; }
.mode.feature { grid-column: span 2; background: var(--ink); color: var(--paper); border-color: var(--ink); }
.mode.feature p, .mode.feature .n { color: color-mix(in srgb, var(--paper) 75%, transparent); }
.mode.feature .ico svg { stroke: var(--ink); }

.plan { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.plan .day { flex: 0 0 auto; min-width: 74px; padding: 10px 8px; text-align: center; border: 1px dashed var(--rule); border-radius: var(--radius-s); background: var(--sheet); font-size: .82rem; }
.plan .day b { display: block; font: 700 1.05rem var(--font-ui); }
.plan .day.is-today { border: 2px solid var(--blue); }
.plan .day.exam { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* Material */
.drop { display: grid; place-items: center; gap: 10px; padding: 34px 20px; text-align: center; border: 2px dashed var(--ink-3); border-radius: var(--radius-m); background: var(--sheet); cursor: pointer; }
.drop.over { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 6%, var(--sheet)); }
.drop svg { width: 46px; height: 46px; stroke: var(--ink-2); fill: none; stroke-width: 1.6; }
.doc-list { display: grid; gap: 10px; }
.doc { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; padding: 14px 18px; }
.doc .kind { font: 700 .74rem var(--font-ui); padding: 4px 8px; border-radius: 4px; background: var(--grid); color: var(--ink-2); text-transform: uppercase; }
.progress-line { display: grid; gap: 6px; padding: 14px 18px; }

/* Kartenliste */
.card-list { display: grid; gap: 10px; }
.card-item { display: grid; grid-template-columns: 1fr 1fr auto; gap: 16px; padding: 14px 18px; align-items: start; }
.card-item .q { font-weight: 700; }
.card-item .t { font: 600 .76rem var(--font-ui); color: var(--ink-3); display: block; margin-bottom: 2px; }
.card-item textarea { min-height: 70px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.chip { border: 1.5px solid var(--rule); background: var(--sheet); border-radius: 99px; padding: 4px 12px; font: 600 .85rem var(--font-ui); cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }

/* Spickzettel */
.cheat { padding: 30px 34px; background-image: linear-gradient(var(--sheet), var(--sheet)); position: relative; }
.cheat::before { content: ''; position: absolute; top: 0; bottom: 0; left: 22px; width: 2px; background: color-mix(in srgb, var(--red) 55%, transparent); }
.cheat > * { margin-left: 18px; }
.terms { display: flex; flex-wrap: wrap; gap: 8px 12px; margin: 12px 0 24px 18px; }
.cheat ol { padding-left: 1.2em; display: grid; gap: 10px; max-width: 72ch; }
.glossary { display: grid; grid-template-columns: minmax(140px, max-content) 1fr; gap: 8px 22px; margin: 14px 0 26px 18px; max-width: 80ch; }
.glossary dt { font-weight: 700; }
.glossary dd { margin: 0; color: var(--ink-2); }

/* Lern-Sitzung */
.session { max-width: 760px; margin: 0 auto; display: grid; gap: 22px; }
.session-top { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; }
.session-top .bar { height: 10px; }
.counter { font: 700 .95rem var(--font-ui); color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* Karteikarte */
.flash { perspective: 1400px; cursor: pointer; }
.flash-inner { position: relative; min-height: 340px; transition: transform .5s cubic-bezier(.3,.7,.2,1); transform-style: preserve-3d; }
.flash.flipped .flash-inner { transform: rotateX(180deg); }
.face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: #FFFEF8; color: #1A2550; border-radius: 4px; box-shadow: 0 2px 0 #d9dbe6, 0 18px 40px -18px rgba(26,37,80,.45);
  padding: 58px 40px 34px; display: grid; align-content: center; gap: 14px; text-align: center;
  background-image: linear-gradient(transparent 0 40px, #E8545F 40px 42px, transparent 42px), repeating-linear-gradient(transparent 0 33px, #BFD4F2 33px 34px);
  background-position: 0 0, 0 42px;
}
.face.back { transform: rotateX(180deg); }
.face .type { position: absolute; top: 11px; left: 18px; font: 600 .8rem var(--font-ui); color: #7480A0; }
.face .hint { position: absolute; bottom: 12px; left: 0; right: 0; font-size: .82rem; color: #7480A0; }
.face .front-text { font: 700 clamp(1.25rem, 3vw, 1.8rem)/1.3 var(--font-ui); }
.face .back-text { font: 400 clamp(1.05rem, 2.4vw, 1.3rem)/1.5 var(--font-body); }
.face .back-q { font-size: .9rem; color: #4B567A; }
.answer-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.answer-row .btn { min-height: 54px; font-size: 1.02rem; }
.btn.know { border-color: var(--ok); color: var(--ok); box-shadow: 0 2px 0 var(--ok); }
.btn.dont { border-color: var(--red); color: var(--red); box-shadow: 0 2px 0 var(--red); }
.boxes { display: flex; gap: 6px; justify-content: center; }
.boxes span { width: 34px; height: 8px; border-radius: 3px; background: var(--grid); }
.boxes span.on { background: var(--ok); }
kbd { font: 600 .78rem var(--font-ui); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--sheet); }

/* Quiz */
.question { padding: 28px 30px; display: grid; gap: 22px; }
.question .qtext { font: 650 1.3rem/1.4 var(--font-ui); }
.question .qtext .gap { display: inline-block; min-width: 5em; border-bottom: 2.5px solid var(--ink); }
.opts { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: center; text-align: left;
  padding: 12px 16px; border: 1.5px solid var(--rule); border-radius: var(--radius-s); background: var(--sheet); cursor: pointer; font-size: 1rem;
}
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt .key { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; border: 1.5px solid var(--ink-3); font: 700 .85rem var(--font-ui); }
.opt.right { border-color: var(--ok); background: color-mix(in srgb, var(--m-gruen) calc(var(--mark-a) * 70%), var(--sheet)); }
.opt.wrong { border-color: var(--red); background: color-mix(in srgb, var(--m-pink) calc(var(--mark-a) * 60%), var(--sheet)); }
.opt:disabled { cursor: default; }
.feedback { padding: 14px 18px; border-radius: var(--radius-s); border-left: 5px solid; }
.feedback.ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 9%, var(--sheet)); }
.feedback.no { border-color: var(--red); background: color-mix(in srgb, var(--red) 8%, var(--sheet)); }
.feedback .src { margin-top: 6px; font-size: .9rem; color: var(--ink-2); }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tf .btn { min-height: 60px; font-size: 1.1rem; }

/* Zuordnen */
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; }
.match .col { display: grid; gap: 10px; align-content: start; }
.tile { padding: 12px 14px; border: 1.5px solid var(--rule); border-radius: var(--radius-s); background: var(--sheet); cursor: pointer; text-align: left; font-size: .97rem; line-height: 1.35; }
.tile:hover:not(:disabled) { border-color: var(--ink); }
.tile.sel { border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 22%, transparent); }
.tile.done { border-color: transparent; background: color-mix(in srgb, var(--c, var(--m-gruen)) calc(var(--mark-a) * 100%), var(--sheet)); cursor: default; }
.tile.shake { animation: shake .35s; border-color: var(--red); }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

/* Ergebnis */
.result { padding: 34px; display: grid; gap: 18px; text-align: center; justify-items: center; }
.grade { font: 700 6rem/0.9 var(--font-hand); color: var(--red); transform: rotate(-6deg); }
.review { display: grid; gap: 10px; text-align: left; width: 100%; }
.review .item { padding: 12px 16px; border-left: 4px solid var(--red); background: var(--paper); border-radius: 4px; }
.review .item.ok { border-color: var(--ok); }
table.results { width: 100%; border-collapse: collapse; }
table.results th, table.results td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--rule); }
table.results th { font: 600 .85rem var(--font-ui); color: var(--ink-3); }

/* Leerer Zustand */
.empty { padding: 40px 30px; display: grid; gap: 16px; justify-items: start; max-width: 640px; }
.empty .margin-note { font-size: 1.9rem; }

/* Dialog, Toast */
dialog { border: 1px solid var(--rule); border-radius: var(--radius-m); padding: 0; background: var(--sheet); color: var(--ink); width: min(560px, calc(100vw - 32px)); box-shadow: 0 30px 80px -20px rgba(0,0,0,.45); }
dialog::backdrop { background: rgba(18, 26, 51, .45); }
dialog form { padding: 24px; display: grid; gap: 16px; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatches label { position: relative; cursor: pointer; }
.swatches input { position: absolute; opacity: 0; }
.swatches span { display: block; width: 38px; height: 38px; border-radius: 8px; background: var(--c); border: 2px solid transparent; }
.swatches input:checked + span { border-color: var(--ink); box-shadow: inset 0 0 0 3px var(--sheet); }
.swatches input:focus-visible + span { outline: 3px solid var(--blue); outline-offset: 2px; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 140%); background: var(--ink); color: var(--paper); padding: 12px 20px; border-radius: 8px; font: 600 .95rem var(--font-ui); transition: transform .25s; z-index: 50; max-width: calc(100vw - 32px); }
#toast.show { transform: translate(-50%, 0); }
.filewarn { max-width: 620px; margin: 10vh auto; display: grid; gap: 14px; }
.note { padding: 14px 18px; border-radius: var(--radius-s); background: color-mix(in srgb, var(--m-gelb) calc(var(--mark-a) * 45%), var(--sheet)); border: 1px solid color-mix(in srgb, var(--m-gelb) 70%, var(--rule)); font-size: .95rem; }
pre.prompt { white-space: pre-wrap; font-size: .85rem; background: var(--paper); padding: 12px; border-radius: 6px; border: 1px solid var(--rule); max-height: 220px; overflow: auto; }

/* Mobil */
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .rail { position: fixed; z-index: 40; inset: 0 auto 0 0; width: 280px; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow); }
  .rail.open { transform: none; }
  .menu-btn { display: inline-flex; position: fixed; top: 12px; right: 12px; z-index: 45; }
  main { padding-top: 64px; }
  .today { grid-template-columns: 1fr; }
  .mode.feature { grid-column: auto; }
  .card-item { grid-template-columns: 1fr; }
  .match { gap: 10px; }
  .face { padding: 54px 20px 34px; }
  .agenda li { grid-template-columns: 60px 1fr; padding: 12px 16px; }
  .agenda li > :last-child { grid-column: 2; }
  .glossary { grid-template-columns: 1fr; gap: 2px; }
  .glossary dd { margin-bottom: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
@media print {
  body { background: #fff; }
  .rail, .tabs, .no-print, .menu-btn, .page-head .row { display: none !important; }
  .shell { display: block; }
  main { padding: 0; max-width: none; }
  .sheet { box-shadow: none; border: 0; }
}
.btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; flex: none; }
.chip input { accent-color: var(--blue); }
[hidden] { display: none !important; }
.btn.menu-btn { display: none; }
@media (max-width: 860px) { .btn.menu-btn { display: inline-flex; position: fixed; top: 12px; right: 12px; z-index: 45; } }
.face .back-q .mk { font-weight: 700; }
#toast:not(.show) { visibility: hidden; transition: transform .25s, visibility 0s .25s; }
.btn.star.on { color: var(--red); }
.filters .chip.star-chip[aria-pressed="true"] { background: var(--red); border-color: var(--red); }
.subject-tile h3, .rail a.nav, .test-row h3 { hyphens: auto; overflow-wrap: anywhere; }
dialog.wide { width: min(820px, calc(100vw - 32px)); }
.reader-text { max-height: 68vh; overflow-y: auto; display: grid; gap: 14px; max-width: 72ch; line-height: 1.7; padding-right: 8px; }
.face { overflow-y: auto; align-content: safe center; overscroll-behavior: contain; }
.face .back-text.long { font-size: 1rem; text-align: left; line-height: 1.55; }

/* LernApp – Design im Stil einer Fintech-App (Referenz: design-referenzen/awesome-design-md/design-md/revolut/DESIGN.md)
   Verlaufs-Kopf mit großer Zahl, runde Aktions-Knöpfe, weiße Karten (Radius 24, keine Schatten),
   Pill-Buttons, Inter mit enger Laufweite bei Zahlen. Akzent Hellblau, dezentes Karopapier unten. */
:root {
  --bg: #F2F3F5;
  --karo: #E5E8ED;
  --card: #FFFFFF;
  --soft: #F1F2F4;
  --hair: #E8EAEE;
  --ink: #191C1F;
  --mute: #6B717C;
  --stone: #8D969E;
  --accent: #1A7BEF;
  --accent-press: #1366CC;
  --accent-soft: #E6F1FE;
  --on-accent: #FFFFFF;
  --green: #00A87E; --green-soft: #E2F6EF;
  --red: #E23B4A;   --red-soft: #FDECEE;
  --star: #F2A100;
  --hero: radial-gradient(90% 70% at 10% 0%, #9EDCFF 0%, rgba(158,220,255,0) 60%),
          radial-gradient(80% 80% at 100% 15%, #2E5BFF 0%, rgba(46,91,255,0) 62%),
          radial-gradient(70% 70% at 45% 110%, #4FC0FF 0%, rgba(79,192,255,0) 70%),
          #1B7AF0;
  --hero-ink: #FFFFFF;
  --glass: rgba(255, 255, 255, .2);
  --glass-strong: rgba(255, 255, 255, .28);
  --t-blau: #2B8CF2; --t-gruen: #00A87E; --t-gelb: #E8A300; --t-pink: #E61E63; --t-orange: #EC7E00; --t-lila: #0E9DB0; --t-grau: #8D969E; --t-rot: #E23B4A;
  --r-card: 24px; --r-row: 16px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

  /* alte Namen (app.css, Lern-Bildschirme) */
  --paper: var(--bg); --sheet: var(--card); --grid: var(--soft); --rule: var(--hair);
  --ink-2: var(--mute); --ink-3: var(--stone); --label: var(--ink); --label-2: var(--mute); --label-3: var(--stone);
  --blue: var(--accent); --blue-press: var(--accent-press); --ok: var(--green); --cell: var(--card); --fill: var(--soft); --sep: var(--hair);
  --font-ui: var(--font); --font-body: var(--font); --font-display: var(--font);
  --radius-s: 12px; --radius-m: 16px; --shadow: none;
  --m-gelb: #FFE066; --m-gruen: #9BE7C9; --m-pink: #FFB1CF; --m-blau: #A9D3FA; --m-orange: #FFC48A; --m-lila: #A9D3FA; --mark-a: .7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --karo: #0E1116; --card: #16181A; --soft: #222428; --hair: rgba(255,255,255,.08);
    --ink: #FFFFFF; --mute: rgba(255,255,255,.66); --stone: rgba(255,255,255,.45);
    --accent: #4DA3FF; --accent-press: #78B8FF; --accent-soft: #10243D; --on-accent: #001326;
    --green-soft: #0C2A22; --red-soft: #2E1215;
    --hero: radial-gradient(90% 70% at 10% 0%, #2A6FD6 0%, rgba(42,111,214,0) 60%), radial-gradient(80% 80% at 100% 15%, #1B2E9E 0%, rgba(27,46,158,0) 62%), radial-gradient(70% 70% at 45% 110%, #0E6AB0 0%, rgba(14,106,176,0) 70%), #0B2F6E;
    --mark-a: .4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --karo: #0E1116; --card: #16181A; --soft: #222428; --hair: rgba(255,255,255,.08);
  --ink: #FFFFFF; --mute: rgba(255,255,255,.66); --stone: rgba(255,255,255,.45);
  --accent: #4DA3FF; --accent-press: #78B8FF; --accent-soft: #10243D; --on-accent: #001326;
  --green-soft: #0C2A22; --red-soft: #2E1215;
  --hero: radial-gradient(90% 70% at 10% 0%, #2A6FD6 0%, rgba(42,111,214,0) 60%), radial-gradient(80% 80% at 100% 15%, #1B2E9E 0%, rgba(27,46,158,0) 62%), radial-gradient(70% 70% at 45% 110%, #0E6AB0 0%, rgba(14,106,176,0) 70%), #0B2F6E;
  --mark-a: .4;
  color-scheme: dark;
}

/* ---------- Grundlagen ---------- */
html, body { min-height: 100%; }
body {
  margin: 0; color: var(--ink); font: 400 16px/1.5 var(--font); letter-spacing: .01em;
  background-color: var(--bg);
  background-image: linear-gradient(var(--karo) 1px, transparent 1px), linear-gradient(90deg, var(--karo) 1px, transparent 1px);
  background-size: 24px 24px;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
h1, h2, h3 { margin: 0; font-family: var(--font); letter-spacing: -.02em; }
p { margin: 0; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.muted { color: var(--mute); }
.small { font-size: 14px; }
.link { color: var(--accent); }
#main { max-width: 600px; margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; align-content: start; }
body.in-session #main { padding-top: 12px; padding-bottom: 32px; }
.stack-l { display: grid; gap: 16px; }
.empty-note { color: var(--mute); text-align: center; padding: 24px 16px; }

/* ---------- Verlaufs-Kopf ---------- */
.rv-hero {
  margin: 0 -16px; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 48px;
  background: var(--hero); color: var(--hero-ink);
  display: grid; gap: 24px;
}
.rv-hero.small { gap: 20px; padding-bottom: 44px; }
.rv-top { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; min-height: 44px; }
.rv-avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: var(--accent); font: 700 16px var(--font); }
.rv-search { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; background: var(--glass); color: rgba(255,255,255,.85); }
.rv-search svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; flex: none; }
.rv-search input { flex: 1; min-width: 0; height: 100%; border: 0 !important; padding: 0 !important; background: none !important; color: #fff; font: 500 15px var(--font); outline: none; box-shadow: none !important; }
.rv-search input::placeholder { color: rgba(255,255,255,.8); }
.rv-icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; border: 0; background: var(--glass); color: #fff; cursor: pointer; text-decoration: none; flex: none; }
.rv-icon-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.rv-icon-btn:active { background: var(--glass-strong); }
.rv-top-title { text-align: center; font: 600 16px var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rv-figure { display: grid; justify-items: center; gap: 8px; text-align: center; padding-top: 8px; }
.rv-label { font: 500 15px var(--font); color: rgba(255,255,255,.85); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rv-big { font: 600 64px/1 var(--font); letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
.rv-hero.small .rv-big { font-size: 56px; }
.rv-unit { font-size: 22px; font-weight: 500; letter-spacing: -.01em; margin-left: 6px; opacity: .9; }
.rv-chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 8px 14px; border-radius: 999px; background: var(--glass); color: #fff; font: 600 14px var(--font); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rv-chip svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.4; flex: none; }
.rv-actions { display: flex; justify-content: center; gap: 12px; }
.rv-action { display: grid; justify-items: center; gap: 8px; width: 76px; border: 0; background: none; color: #fff; text-decoration: none; font: 500 13px/1.2 var(--font); cursor: pointer; text-align: center; }
.rv-action-ico { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--glass); transition: background .15s, transform .1s; }
.rv-action-ico svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.rv-action:active .rv-action-ico { background: var(--glass-strong); transform: scale(.94); }

/* Inhalt rutscht über den Kopf */
.rv-body { margin-top: -28px; position: relative; display: grid; gap: 16px; }

/* ---------- Karten ---------- */
.rv-card { background: var(--card); border-radius: var(--r-card); padding: 8px 0; }
.rv-card-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px 4px; }
.rv-card-head h2 { font: 600 18px var(--font); letter-spacing: -.01em; }
.rv-link { border: 0; background: none; color: var(--accent); font: 600 15px var(--font); cursor: pointer; padding: 4px 0; }
.rv-rows { display: grid; }
.rv-row {
  display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px; padding: 10px 20px;
  border: 0; background: none; color: var(--ink); text-decoration: none; text-align: left; font: inherit; cursor: pointer;
}
.rv-row:active { background: var(--soft); }
.rv-row.disabled { opacity: .4; pointer-events: none; }
.rv-row.danger .row-title { color: var(--red); }
.row-txt { display: grid; gap: 1px; min-width: 0; flex: 1; }
.row-title { font: 500 16px/1.35 var(--font); overflow-wrap: anywhere; hyphens: auto; }
.row-sub { font: 400 14px/1.4 var(--font); color: var(--mute); overflow-wrap: anywhere; }
.row-sub.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row-right { display: grid; justify-items: end; gap: 1px; flex: none; text-align: right; }
.row-right b { font: 600 16px var(--font); font-variant-numeric: tabular-nums; }
.row-right small { font-size: 13px; color: var(--mute); }
.chev { width: 18px; height: 18px; flex: none; fill: none; stroke: var(--stone); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.rv-foot { padding: 4px 20px 12px; font-size: 13px; color: var(--mute); }
.rv-card.empty { padding: 32px 24px; display: grid; gap: 10px; justify-items: center; text-align: center; color: var(--mute); }
.empty-title { font: 600 20px var(--font); color: var(--ink); letter-spacing: -.02em; }
.rv-card.empty .btn { width: 100%; max-width: 320px; margin-top: 8px; }
.rv-plain-head { padding: calc(16px + env(safe-area-inset-top, 0px)) 4px 0; }
.rv-plain-head h1 { font: 600 34px/1.1 var(--font); letter-spacing: -.04em; }

/* Runde Icons */
.dot-ico { --c: var(--t-blau); width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--c); color: #fff; font: 700 12px/1 var(--font); letter-spacing: -.02em; }
.dot-ico svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.dot-ico[data-tone="gruen"] { --c: var(--t-gruen); } .dot-ico[data-tone="gelb"] { --c: var(--t-gelb); } .dot-ico[data-tone="pink"] { --c: var(--t-pink); }
.dot-ico[data-tone="orange"] { --c: var(--t-orange); } .dot-ico[data-tone="lila"] { --c: var(--t-lila); } .dot-ico[data-tone="grau"] { --c: var(--t-grau); } .dot-ico[data-tone="rot"] { --c: var(--t-rot); }
.dot-ico.add { background: var(--accent-soft); color: var(--accent); }
.dot-ico.lg { width: 56px; height: 56px; font-size: 16px; }

/* Kennzahl-Kacheln */
.rv-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.rv-tile { display: grid; gap: 6px; align-content: start; padding: 16px 18px; border-radius: var(--r-card); background: var(--card); color: var(--ink); text-decoration: none; }
.rv-tile small { font-size: 13px; color: var(--mute); }
.rv-tile b { font: 600 32px/1.1 var(--font); letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.rv-tile b span { font-size: 15px; font-weight: 500; letter-spacing: 0; margin-left: 4px; color: var(--mute); }
.rv-meter { height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; margin: 4px 0; }
.rv-meter i { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
.rv-days { display: flex; gap: 4px; margin: 4px 0; }
.rv-days i { flex: 1; height: 6px; border-radius: 3px; background: var(--soft); }
.rv-days i.on { background: var(--green); }

/* Reiter als Pills */
.rv-pills { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.rv-pills a, .rv-pills button { flex: none; padding: 9px 16px; border-radius: 999px; border: 0; background: var(--card); color: var(--ink); text-decoration: none; font: 600 14px var(--font); cursor: pointer; }
.rv-pills [aria-current="page"] { background: var(--ink); color: var(--card); }
.rv-pill { flex: none; padding: 6px 12px; border-radius: 999px; background: var(--soft); color: var(--ink); font: 600 13px var(--font); }
details.rv-row { display: block; padding: 0; min-height: 0; }
details.rv-row summary { list-style: none; display: flex; align-items: center; gap: 14px; padding: 10px 20px; min-height: 64px; cursor: pointer; }
details.rv-row summary::-webkit-details-marker { display: none; }
details.rv-row[open] .rv-pill { background: var(--ink); color: var(--card); }
details.rv-row .dot-ico { font-size: 18px; }
.disclose-body { padding: 0 20px 16px 74px; color: var(--mute); font-size: 15px; line-height: 1.55; }

/* ---------- Knöpfe ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 12px 24px;
  border: 0; border-radius: 999px; background: var(--soft); color: var(--ink); font: 600 16px var(--font); letter-spacing: .01em;
  text-decoration: none; cursor: pointer; box-shadow: none !important; transition: transform .1s, background .15s;
}
.btn:hover { background: var(--soft); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent); filter: none; }
.btn.primary:active { background: var(--accent-press); }
.btn.ghost, .btn.plain { background: none; padding-inline: 10px; color: var(--accent); }
.btn.danger { background: var(--red-soft); color: var(--red); border: 0; }
.btn.big { min-height: 52px; width: 100%; }
.btn.small { min-height: 36px; padding: 6px 16px; font-size: 14px; }
.btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; }
.btn:disabled { opacity: .4; }
.danger-text { color: var(--red) !important; }
.btn.know { background: var(--green-soft); color: var(--green); border: 0; }
.btn.dont { background: var(--red-soft); color: var(--red); border: 0; }

/* ---------- Formulare ---------- */
label.field { display: grid; gap: 6px; font: 500 13px var(--font); color: var(--mute); }
input[type="text"], input[type="date"], input[type="number"], input[type="search"], textarea, select {
  width: 100%; min-height: 52px; padding: 14px 16px; border-radius: 12px; border: 0; background: var(--card); color: var(--ink); font: 16px var(--font); box-shadow: none;
}
input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; box-shadow: none; }
textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
.swatches { display: flex; gap: 12px; flex-wrap: wrap; }
.swatches label { position: relative; cursor: pointer; }
.swatches input { position: absolute; opacity: 0; }
.swatches .dot-ico { width: 36px; height: 36px; }
.swatches input:checked + .dot-ico { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--ink); }
.chip { border: 0; background: var(--card); border-radius: 999px; padding: 8px 14px; min-height: 36px; font: 600 14px var(--font); color: var(--ink); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--card); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.stack { display: grid; gap: 16px; }
.seg { display: flex; gap: 6px; padding: 0; background: none; overflow-x: auto; }
.seg > a, .seg > button { flex: none; padding: 8px 14px; border-radius: 999px; border: 0; background: var(--soft); color: var(--ink); font: 600 14px var(--font); cursor: pointer; text-decoration: none; }
.seg > [aria-current="page"] { background: var(--ink); color: var(--card); }
.rv-row .seg { width: 100%; }
.search { display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 16px; border-radius: 999px; background: var(--card); color: var(--mute); }
.search svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; flex: none; }
.search input { flex: 1; min-width: 0; min-height: 0; height: 100%; border: 0 !important; padding: 0 !important; background: none !important; font: 16px var(--font); color: var(--ink); outline: none; box-shadow: none !important; }

/* Material, Karten, Spickzettel */
.progress-card { display: grid; gap: 8px; padding: 18px 20px; border-radius: var(--r-card); background: var(--card); }
.meter { height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
.meter i.indet { width: 35%; animation: indet 1.1s ease-in-out infinite alternate; }
@keyframes indet { from { margin-left: 0; } to { margin-left: 65%; } }
.card-cell { align-items: flex-start; }
.starbtn { flex: none; width: 44px; height: 44px; margin: -6px -12px -6px 0; border: 0; background: none; font-size: 22px; line-height: 1; color: var(--stone); cursor: pointer; }
.starbtn.on { color: var(--star); }
.terms { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 20px 16px; }
.term { padding: 6px 12px; border-radius: 999px; background: var(--soft); font: 500 14px var(--font); }
.sheet-paper { margin: 0; padding: 8px 20px 16px 40px; display: grid; gap: 12px; line-height: 1.6; font-size: 15px; }
.mk { --c: var(--m-blau); background: linear-gradient(transparent 55%, color-mix(in srgb, var(--c) calc(var(--mark-a) * 100%), transparent) 55%); }
.reader-text { display: grid; gap: 12px; line-height: 1.6; font-size: 16px; }

/* ---------- Sheets ---------- */
#sheet, #dialog { border: 0; padding: 8px 16px calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--bg); color: var(--ink); width: 100%; max-width: 600px; max-height: 92vh; overflow-y: auto; }
#sheet { margin: auto auto 0; border-radius: 24px 24px 0 0; }
#sheet[open] { animation: sheet-in .28s cubic-bezier(.2,.8,.2,1); }
@keyframes sheet-in { from { transform: translateY(40px); opacity: .6; } }
#sheet::backdrop, #dialog::backdrop { background: rgba(0,0,0,.4); }
.grabber { width: 40px; height: 5px; border-radius: 3px; background: var(--stone); opacity: .5; margin: 0 auto 12px; }
.sheet-h { font: 600 24px var(--font); letter-spacing: -.03em; }
.sheet-title { text-align: center; font-size: 14px; color: var(--mute); padding: 4px 16px; }

In Zeiten immer neuer Wirtschafts-Skandale und Krisen feiert der ehrbare Kaufmann eine Renaissance. Woher das traditionelle Leitbild ursprünglich stammt und welche Werte man heute damit verknüpft.

Das Leitbild des ehrbaren Kaufmanns hat eine lange Tradition. Nachweislich seit dem 12. Jahrhundert wurden in Europa bestimmte Tugenden in den Handbüchern der Kaufleute gelehrt. Die Wurzeln liegen im italienischen Venedig und den norddeutschen Städtebund der Hanse. Von dem Handelszentrum im Süden ausgehend verbreitete sich das Leitbild über die Kaufmanns-Vereinigungen im Norden in ganz Europa.

Christoph Lütge, Inhaber des Lehrstuhls für Wirtschaftsethik an der Technischen Universität München, hat sich intensiv mit der Geschichte des ehrbaren Kaufmanns beschäftigt. Die ersten Kaufleute – im frühen Mittelalter noch zu Fuß und zu Wasser unterwegs – lebten demnach auf ihren Reisen gefährlich und mussten hohe Risiken eingehen, weil sie in jeder Stadt fremd und ohne jegliche Reputation waren. „Oftmals begegnete man den Reisenden mit Skepsis oder sie wurden gar als Betrüger verdächtigt“, sagt Lütge. Das erschwerte den Handel beträchtlich. Um das Vertrauen in die Kaufleute zu stärken und die Bedingungen des Wirtschaftens zu verbessern, entstanden mit dem Aufstreben der Städte ab der Mitte des 12. Jahrhunderts vielerorts Kaufmannsgilden und Vereinigungen wie die Hanse. Nach Auskunft des Wissenschaftlers standen sie für spezifische Verhaltensnormen nach dem Grundsatz von Treu und Glauben und fungierten als Gütesiegel.

 mit dem Ziel, den geschäftlichen Erfolg langfristig zu sichern – auch über Generationen hinweg.

Die Rahmenbedingungen ändern sich
Im 15. Jahrhundert gelangten die Kaufleute zu größerem Einfluss. „Die Hanse im Norden oder die Fugger und Welser im Süden von Deutschland bildeten regelrechte Handelsmonopole heraus“, erklärt Lütge. Die Ehrbarkeit spielt hierbei demzufolge eine wichtige Rolle. „Viele Kaufleute fühlten sich ethischen Grundsätzen verpflichtet. Sie folgten nicht nur bei ihren Geschäftsabwicklungen klaren Prinzipien, sondern sie übernahmen auch Verantwortung für ihre Heimat“, sagt der Wirtschaftsethiker der Technischen Universität München. Der Grund: Die Kaufleute wollten ihrer Region etwas zurückgeben, da diese ihren gesellschaftlichen Aufstieg erst ermöglichte.

Im Laufe der Zeit passten sich die ethischen Regeln immer wieder an gewandelte ökonomische Rahmenbedingungen an. „In ihrem Kern blieben die Grundsätze aber unverändert. Sie basieren auf christlichen Werten und standen für Verantwortung“, betont Lütge. Nach Jahrhunderten blühender Handelsbeziehungen folgte der wirtschaftliche Stillstand während des Dreißigjährigen Krieges (1614-1648) und der Niedergang der Hanse. Im 17. und 18. Jahrhundert wandelte sich die Wertvorstellung in der Wirtschaft fundamental. „Im Zuge der Aufklärung trat die Religion als Grundlage des kaufmännischen Ehrverständnisses zugunsten von Vernunft und Moral zurück“, sagt Lütge. Mit dem Beginn der Industrialisierung im 18. Jahrhundert seien die Tugenden des ehrbaren Kaufmanns zunehmend in Vergessenheit geraten. Gesellschaftliches Ansehen erwarb ein Unternehmer demnach nun durch größtmöglichen Reichtum und nicht mehr durch gemeinnütziges Engagement. Anspruch und Wirklichkeit entkoppelten sich auch dadurch, dass Betriebe immer öfter nicht durch Eigentümer, sondern durch angestellte Geschäftsführer geleitet wurden, die dem Druck, immer größere Gewinne zu erzielen, nicht so leicht widerstehen konnten. „In der Folgezeit wurde deutlich, dass diese neuen Maßstäbe Unternehmertum und Gesellschaft stark entzweiten. Das Wirtschaften ohne Verantwortungsübernahme ging vor allem auf Kosten der Arbeitnehmer, was letztlich zu Arbeiteraufständen führte“, erklärt Lütge.

Der Ruf nimmt Schaden
In der heutigen Gesellschaft scheinen Ökonomie und Moral häufig nicht miteinander vereinbar zu sein: Die Finanzmarkt- und Wirtschaftskrise erschütterte das Vertrauen in die Wirtschaft, verschärfte den Wettbewerb zwischen den Unternehmen. In der Öffentlichkeit entstand der Eindruck, dass wirtschaftliche Aktivitäten und gesellschaftliche Interessen im Widerspruch zueinanderstehen. Im Markt selbst führte die Ellenbogenmentalität vermehrt zu Pleiten. Um diesem Negativtrend entgegenzusteuern, entdeckten zwischen 2007 und 2009 viele Unternehmen die Tugenden des Mittelalters wieder. Der Begriff des ehrbaren Kaufmanns wird heute zunehmend durch Anglizismen wie Good Governance, Fair Play und Corporate Social Responsibility verdrängt. Im Unterschied zu vergangenen Zeiten besteht aber weit weniger Konsens darüber, was einen verantwortungsbewussten Geschäftsmann auszeichnet.

Andre Gieße – Quelle: Verkehrsrundschau 30/2014`,

__m.extract = (() => {
// Text aus hochgeladenen Dateien holen – komplett lokal im Browser.
// PDF: pdf.js (Textebene, bei Scans OCR) · Word/PowerPoint/OpenOffice: ZIP+XML · Bilder: Tesseract OCR (Deutsch)
// Bei Fotos werden zusätzlich farbig markierte Wörter (Textmarker) erkannt.

// Pfad zu lib/ – die Handy-Version liegt eine Ebene tiefer und setzt window.LERNAPP_BASE = '../'
const abs = (p) => new URL((window.LERNAPP_BASE || '') + p, location.href).href;

const ACCEPT = '.pdf,.docx,.pptx,.odt,.odp,.txt,.md,.csv,.rtf,.png,.jpg,.jpeg,.webp,.bmp,.gif,.heic';

async function extractFile(file, onStatus = () => {}) {
  const name = file.name;
  const ext = name.split('.').pop().toLowerCase();
  if (['txt', 'md', 'csv'].includes(ext)) return { kind: 'text', text: await file.text(), highlights: [] };
  if (ext === 'rtf') return { kind: 'text', text: rtfToText(await file.text()), highlights: [] };
  if (ext === 'pdf') return extractPdf(file, onStatus);
  if (['docx', 'pptx', 'odt', 'odp'].includes(ext)) return { kind: ext, text: await extractOffice(file, ext), highlights: [] };
  if (file.type.startsWith('image/') || ['png', 'jpg', 'jpeg', 'webp', 'bmp', 'gif'].includes(ext)) {
    onStatus('Bild wird gelesen (Texterkennung) …');
    const bmp = await loadImage(file);
    return { kind: 'bild', ...(await ocrCanvas(bmp, onStatus)) };
  }
  throw new Error(`Dateityp .${ext} wird nicht unterstützt.`);
}

// ---------- PDF ----------
let pdfjs;
async function loadPdfjs() {
  if (!pdfjs) {
    pdfjs = await import(abs('lib/pdfjs/pdf.min.mjs'));
    pdfjs.GlobalWorkerOptions.workerSrc = abs('lib/pdfjs/pdf.worker.min.mjs');
  }
  return pdfjs;
}
async function extractPdf(file, onStatus) {
  await loadPdfjs();
  const doc = await pdfjs.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const parts = [];
  const highlights = [];
  for (let i = 1; i <= doc.numPages; i++) {
    onStatus(`PDF Seite ${i} von ${doc.numPages} …`);
    const page = await doc.getPage(i);
    const tc = await page.getTextContent();
    let text = '';
    for (const it of tc.items) text += it.str + (it.hasEOL ? '\n' : (it.str.endsWith(' ') ? '' : ' '));
    if (text.replace(/\s/g, '').length < 40) {
      // gescannte Seite → rendern und OCR
      const vp = page.getViewport({ scale: 2.2 });
      const canvas = document.createElement('canvas');
      canvas.width = vp.width; canvas.height = vp.height;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
      const r = await ocrCanvas(canvas, (s) => onStatus(`PDF Seite ${i}: ${s}`));
      text = r.text; highlights.push(...r.highlights);
    }
    parts.push(text);
  }
  return { kind: 'pdf', text: parts.join('\n\n'), highlights };
}

// ---------- Office (ZIP + XML) ----------
async function extractOffice(file, ext) {
  const zip = await readZip(await file.arrayBuffer());
  const xmlText = (xml, paraTag, textTag) => {
    const doc = new DOMParser().parseFromString(xml, 'application/xml');
    const out = [];
    for (const p of doc.getElementsByTagName(paraTag)) {
      let line = '';
      const walk = (n) => {
        for (const c of n.childNodes) {
          if (c.nodeType !== 1) continue;
          if (c.tagName === textTag) line += c.textContent;
          else if (c.localName === 'tab') line += '\t';
          else if (c.localName === 'br' || c.localName === 'line-break') line += '\n';
          else walk(c);
        }
      };
      walk(p);
      out.push(line);
    }
    return out.join('\n');
  };
  if (ext === 'docx') {
    const xml = await zip.text('word/document.xml');
    // Tabellenzellen in einer Zeile mit Tab trennen
    const prepared = xml.replace(/<\/w:p>\s*<\/w:tc>\s*<w:tc>/g, '</w:p><w:p><w:r><w:t>\u0001</w:t></w:r></w:p>');
    return xmlText(prepared, 'w:p', 'w:t').replace(/\n\u0001\n/g, '\t').replace(/\u0001/g, '\t');
  }
  if (ext === 'pptx') {
    const slides = zip.names.filter((n) => /^ppt\/slides\/slide\d+\.xml$/.test(n))
      .sort((a, b) => parseInt(a.match(/\d+/)[0]) - parseInt(b.match(/\d+/)[0]));
    const out = [];
    for (const s of slides) out.push(xmlText(await zip.text(s), 'a:p', 'a:t'));
    return out.join('\n\n');
  }
  // ODT / ODP
  const xml = await zip.text('content.xml');
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const out = [];
  const all = doc.getElementsByTagName('*');
  for (const el of all) if (el.localName === 'p' || el.localName === 'h') out.push(el.textContent);
  return out.join('\n');
}

async function readZip(buf) {
  const dv = new DataView(buf);
  let eocd = -1;
  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('Datei ist beschädigt oder kein Office-Dokument.');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const entries = {};
  const dec = new TextDecoder();
  for (let i = 0; i < count; i++) {
    const method = dv.getUint16(p + 10, true);
    const csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const local = dv.getUint32(p + 42, true);
    const name = dec.decode(new Uint8Array(buf, p + 46, nlen));
    entries[name] = { method, csize, local };
    p += 46 + nlen + xlen + clen;
  }
  return {
    names: Object.keys(entries),
    async text(name) {
      const e = entries[name];
      if (!e) throw new Error(`${name} fehlt im Dokument.`);
      const lnl = dv.getUint16(e.local + 26, true), lxl = dv.getUint16(e.local + 28, true);
      const data = new Uint8Array(buf, e.local + 30 + lnl + lxl, e.csize);
      if (e.method === 0) return dec.decode(data);
      const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return new Response(stream).text();
    },
  };
}

function rtfToText(rtf) {
  return rtf.replace(/\\par[d]?/g, '\n').replace(/\\'([0-9a-f]{2})/gi, (_, h) => String.fromCharCode(parseInt(h, 16)))
    .replace(/\\[a-z]+-?\d* ?/gi, '').replace(/[{}]/g, '').trim();
}

// ---------- Bilder / OCR ----------
async function loadImage(file) {
  try {
    return await createImageBitmap(file, { imageOrientation: 'from-image' });
  } catch {
    throw new Error('Bild konnte nicht geöffnet werden (HEIC bitte vorher als JPG speichern).');
  }
}

let workerPromise;
function getWorker(onStatus) {
  if (!workerPromise) {
    onStatus('Texterkennung wird geladen …');
    workerPromise = (async () => {
      await loadScript(abs('lib/tesseract/tesseract.min.js'));
      return window.Tesseract.createWorker('deu', 1, {
        workerPath: abs('lib/tesseract/worker.min.js'),
        corePath: abs('lib/tesseract/core'),
        langPath: abs('lib/tesseract/lang'),
        gzip: true,
        workerBlobURL: false,
        logger: (m) => {
          if (m.status === 'recognizing text') currentStatus(`Texterkennung ${Math.round(m.progress * 100)} %`);
        },
      });
    })();
    workerPromise.catch(() => { workerPromise = null; });
  }
  return workerPromise;
}
let currentStatus = () => {};

function loadScript(src) {
  return new Promise((res, rej) => {
    if ([...document.scripts].some((s) => s.src === src)) return res();
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error('Texterkennung konnte nicht geladen werden.'));
    document.head.appendChild(s);
  });
}

async function ocrCanvas(source, onStatus) {
  currentStatus = onStatus;
  const worker = await getWorker(onStatus);
  // auf sinnvolle Größe bringen: lange Seite ca. 2400 px
  const w0 = source.width, h0 = source.height;
  const scale = Math.min(2.5, 2400 / Math.max(w0, h0));
  const W = Math.round(w0 * scale), H = Math.round(h0 * scale);
  const color = document.createElement('canvas');
  color.width = W; color.height = H;
  const cctx = color.getContext('2d', { willReadFrequently: true });
  cctx.drawImage(source, 0, 0, W, H);
  const rgba = cctx.getImageData(0, 0, W, H);

  // Graustufen + Kontrast; Textmarker-Farbe wird zu Weiß, damit sie die Erkennung nicht stört
  const gray = document.createElement('canvas');
  gray.width = W; gray.height = H;
  const gctx = gray.getContext('2d');
  const out = gctx.createImageData(W, H);
  const mark = new Uint8Array(W * H);
  const d = rgba.data, o = out.data;
  for (let i = 0, j = 0; i < d.length; i += 4, j++) {
    const r = d[i], g = d[i + 1], b = d[i + 2];
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    const sat = max ? (max - min) / max : 0;
    let y = 0.299 * r + 0.587 * g + 0.114 * b;
    if (sat > 0.18 && max > 120) { mark[j] = 1; y = Math.min(255, y * 1.25 + 20); }
    o[i] = o[i + 1] = o[i + 2] = y; o[i + 3] = 255;
  }
  gctx.putImageData(out, 0, 0);

  onStatus('Texterkennung läuft …');
  const { data } = await worker.recognize(gray, {}, { text: true, blocks: true });
  const highlights = findHighlights(data, mark, W);
  return { text: cleanOcr(data.text), highlights };
}

function findHighlights(data, mark, W) {
  const phrases = [];
  let cur = [];
  const flush = () => { if (cur.length) phrases.push(cur.join(' ')); cur = []; };
  for (const block of data.blocks || []) for (const para of block.paragraphs) for (const line of para.lines) {
    for (const word of line.words) {
      const { x0, y0, x1, y1 } = word.bbox;
      let hit = 0, n = 0;
      for (let y = y0; y < y1; y += 2) for (let x = x0; x < x1; x += 2) { n++; hit += mark[y * W + x]; }
      const clean = word.text.replace(/^[„"“(»]+|[“"”),.;:!?«]+$/g, '');
      if (n && hit / n > 0.22 && word.confidence > 55 && clean.length > 1) cur.push(clean);
      else flush();
    }
    flush();
  }
  return [...new Set(phrases.filter((p) => p.length > 3 && /[A-Za-zÄÖÜäöüß]{3}/.test(p)))];
}

function cleanOcr(t) {
  return t
    .replace(/[|]/g, '')
    .split('\n')
    .map((l) => l.replace(/^(?:[IiOo'=\-_~,.:;]{1,2}\s+)+(?=\S{3})/, '').replace(/(?:\s+[IiOo'=\-_~,.:;]{1,2})+$/, '').trim())
    .join('\n')
    .replace(/\n{3,}/g, '\n\n').trim();
}

return { ACCEPT, extractFile, loadPdfjs };

let box;

  };

    box.querySelector('.viewer-body').innerHTML = '';

}

// doc.files: Liste von IDs im Gerätespeicher; doc.urls: öffentlich mitgelieferte Bilder (Beispiel-Set)
function hasOriginal(doc) {
  return !!(doc.fileIds?.length || doc.urls?.length);
}

async function openOriginal(doc) {
  const v = shell();
  const body = v.querySelector('.viewer-body');
  v.querySelector('.viewer-title').textContent = doc.name;
  const dl = v.querySelector('[data-dl]');
  body.innerHTML = '<p class="muted viewer-wait">Blatt wird geladen …</p>';
  v.showModal();
  const items = [];
  for (const u of doc.urls || []) items.push({ url: new URL((window.LERNAPP_BASE || '') + u, location.href).href, type: 'image/jpeg', name: doc.name });
  for (const id of doc.fileIds || []) {
    const f = await getFile(id);
    if (f) items.push({ blob: f, url: URL.createObjectURL(f), type: f.type, name: f.name || doc.name, own: true });
  }
  if (!items.length) {
    body.innerHTML = '<p class="muted viewer-wait">Das Original ist auf diesem Gerät nicht gespeichert. Es liegt nur auf dem Gerät, auf dem es hochgeladen wurde.</p>';
    dl.hidden = true;
    return;
  }
  dl.hidden = false;
  dl.href = items[0].url; dl.download = items[0].name;
  body.innerHTML = '';
  for (const it of items) {
    if (it.type.startsWith('image/')) {
      const img = new Image();
      img.src = it.url; img.alt = it.name; img.className = 'viewer-page';
      if (it.own) img.dataset.url = it.url;
      body.appendChild(img);
    } else if (it.type === 'application/pdf' || /\.pdf$/i.test(it.name)) {
      await renderPdf(it, body);
    } else {
      const p = document.createElement('div');
      p.className = 'viewer-wait';
      p.innerHTML = `<p>Diese Datei (${h(it.name)}) kann hier nicht angezeigt werden.</p><a class="btn primary" href="${it.url}" download="${h(it.name)}" data-url="${it.url}">In Word/PowerPoint öffnen</a>`;
      body.appendChild(p);
    }
  }
}

async function renderPdf(it, body) {
  try {
    const pdfjs = await loadPdfjs();
    const data = new Uint8Array(await (it.blob || await (await fetch(it.url)).blob()).arrayBuffer());
    const pdf = await pdfjs.getDocument({ data }).promise;
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const vp = page.getViewport({ scale: 2 });
      const c = document.createElement('canvas');
      c.width = vp.width; c.height = vp.height; c.className = 'viewer-page';
      body.appendChild(c);
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    }
  } catch (e) {
    console.error(e);
    toast('PDF konnte nicht angezeigt werden – über „Herunterladen“ öffnen.');
  }
}

return { hasOriginal, openOriginal };

}

// Legt den Deutsch-Test an; gibt null zurück, wenn er schon existiert
function loadBeispiel() {
  const st = S.get();
  if (st.tests.some((t) => t.title === BEISPIEL.test.title)) return null;
  const s = st.subjects.find((x) => x.name === BEISPIEL.subject.name) || S.addSubject(BEISPIEL.subject.name, BEISPIEL.subject.color);
  const t = S.addTest(s.id, BEISPIEL.test.title, '', BEISPIEL.test.notes);
  for (const bd of BEISPIEL.docs) addBeispielDoc(t.id, bd);
  return t;
}

// Einmalige Einrichtung: Fächer laut Stundenplan, Deutsch-Test, Kurzarbeit-Fragen
function migrate() {
  const st = S.get();
  st.setup ||= {};
  if (!st.setup.faecherV1) {
    const old = st.subjects.find((s) => s.name === 'Deutsch / Kommunikation');
    if (old) old.name = 'D – Deutsch';
    for (const f of FAECHER) if (!st.subjects.some((s) => s.name === f.name)) st.subjects.push({ id: S.uid(), ...f });
    st.setup.faecherV1 = true;
  }
  if (!st.setup.beispielAutoV1) {
    st.setup.beispielAutoV1 = true;
    if (loadBeispiel()) st.setup.kurzarbeitV1 = true;
  }
  if (!st.setup.kurzarbeitV1) {
    const t = st.tests.find((x) => x.title === BEISPIEL.test.title);
    if (t && !S.docsOf(t.id).some((d) => d.name === KURZARBEIT.name)) {
      addBeispielDoc(t.id, KURZARBEIT);
      t.notes = BEISPIEL.test.notes;
    }
    st.setup.kurzarbeitV1 = true;
  }
  // Inhalte auf den Stand der Unterlagen bringen (keine selbst formulierten Antworten mehr)
  if (!st.setup.unterlagenV2) {
    const t = st.tests.find((x) => x.title === BEISPIEL.test.title);
    if (t) {
      t.notes = BEISPIEL.test.notes;
      // Früher automatisch gesetztes Datum (Anlage + 9 Tage) entfernen; selbst eingetragene Daten bleiben
      const auto = new Date(t.createdAt + 9 * 864e5);
      const autoIso = `${auto.getFullYear()}-${String(auto.getMonth() + 1).padStart(2, '0')}-${String(auto.getDate()).padStart(2, '0')}`;
      if (t.date === autoIso) t.date = '';
      for (const bd of BEISPIEL.docs) {
        const d = S.docsOf(t.id).find((x) => x.name === bd.name || (bd.oldNames || []).includes(x.name));
        if (!d || (d.text === bd.text && d.name === bd.name)) continue;
        S.get().cards.filter((c) => c.docId === d.id).forEach((c) => S.deleteCard(c.id));
        S.deleteDoc(d.id);
        addBeispielDoc(t.id, bd);
      }
    }
    st.setup.unterlagenV2 = true;
  }
  // Original-Fotos der Beispiel-Blätter verknüpfen
  if (!st.setup.blaetterV1) {
    const t = st.tests.find((x) => x.title === BEISPIEL.test.title);
    if (t) for (const bd of BEISPIEL.docs) {
      const d = S.docsOf(t.id).find((x) => x.name === bd.name);
      if (d && bd.urls) d.urls = bd.urls;
    }
    st.setup.blaetterV1 = true;
  }
  S.save();
}

return { addGenerated, addBeispielDoc, loadBeispiel, migrate };
})();
