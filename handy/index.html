<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='7' width='26' height='18' rx='2' fill='%23fff' stroke='%231A2550' stroke-width='2'/%3E%3Cpath d='M3 12h26' stroke='%23D3263A' stroke-width='2'/%3E%3Cpath d='M8 17h16M8 21h10' stroke='%23BDB4FF' stroke-width='3'/%3E%3C/svg%3E">

<body>
<script>window.LERNAPP_BASE = '../';</script>
<title>LernApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* LernApp – Collegeblock & Textmarker */
:root {
  --paper: #FAFBFD;
  --sheet: #FFFFFF;
  --grid: #E6ECF5;
  --rule: #CBD5E6;
  --ink: #1A2550;
  --ink-2: #4B567A;
  --ink-3: #7480A0;
  --blue: #2B47C9;
  --blue-press: #2139A8;
  --red: #D3263A;
  --ok: #16865A;
  --m-gelb: #FFE45C;
  --m-gruen: #8EF0A8;
  --m-pink: #FF9FCF;
  --m-blau: #9CC9FF;
  --m-orange: #FFB86B;
  --m-lila: #BDB4FF;
  --mark-a: .75;
  --shadow: 0 1px 0 rgba(26, 37, 80, .06), 0 6px 18px -10px rgba(26, 37, 80, .25);
  --radius-s: 6px;
  --radius-m: 10px;
  --font-ui: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --font-hand: 'Caveat', 'Segoe Print', 'Comic Sans MS', cursive;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121A33; --sheet: #18213F; --grid: #1D2748; --rule: #2E3A63;
    --ink: #EEF1FA; --ink-2: #B9C1DA; --ink-3: #8A94B4;
    --blue: #8FA6FF; --blue-press: #A9BAFF; --red: #FF6B7A; --ok: #5BD69B;
    --mark-a: .45;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 24px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121A33; --sheet: #18213F; --grid: #1D2748; --rule: #2E3A63;
  --ink: #EEF1FA; --ink-2: #B9C1DA; --ink-3: #8A94B4;
  --blue: #8FA6FF; --blue-press: #A9BAFF; --red: #FF6B7A; --ok: #5BD69B;
  --mark-a: .45;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 24px -12px rgba(0,0,0,.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 20px 20px;
  color: var(--ink);
  font: 17px/1.55 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--font-ui); line-height: 1.15; margin: 0; letter-spacing: -.01em; }
h1 { font-size: clamp(1.9rem, 4vw, 2.7rem); font-weight: 750; }
h2 { font-size: 1.45rem; font-weight: 700; }
h3 { font-size: 1.12rem; font-weight: 650; }
p { margin: 0; }
a { color: var(--blue); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 4px; }
.skip { position: absolute; left: -999px; }
.skip:focus { left: 12px; top: 12px; z-index: 99; background: var(--sheet); padding: 8px 12px; }
.muted { color: var(--ink-2); }
.small { font-size: .88rem; }
.hand { font-family: var(--font-hand); font-weight: 700; }

/* Textmarker */
.mk { --c: var(--m-gelb); background: linear-gradient(transparent 12%, color-mix(in srgb, var(--c) calc(var(--mark-a) * 100%), transparent) 12%, color-mix(in srgb, var(--c) calc(var(--mark-a) * 100%), transparent) 88%, transparent 88%); border-radius: 3px 8px 4px 9px; padding: 0 .15em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
[data-c="gelb"] { --c: var(--m-gelb); } [data-c="gruen"] { --c: var(--m-gruen); } [data-c="pink"] { --c: var(--m-pink); }
[data-c="blau"] { --c: var(--m-blau); } [data-c="orange"] { --c: var(--m-orange); } [data-c="lila"] { --c: var(--m-lila); }

/* Shell */
.shell { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100vh; }
.rail {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: var(--sheet); border-right: 1px solid var(--rule);
  padding: 22px 0 22px 0; display: flex; flex-direction: column; gap: 4px;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 22px 18px; text-decoration: none; color: var(--ink); }
.brand svg { flex: none; }
.brand b { font: 800 1.35rem/1 var(--font-ui); letter-spacing: -.02em; }
.rail-head { padding: 14px 22px 6px; font: 600 .82rem var(--font-ui); color: var(--ink-3); }
.rail a.nav {
  position: relative; display: flex; align-items: center; gap: 10px;
  padding: 8px 22px 8px 30px; color: var(--ink); text-decoration: none; font-family: var(--font-ui); font-weight: 520;
}
.rail a.nav::before { content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 16px; border-radius: 0 6px 6px 0; background: var(--c, var(--rule)); }
.rail a.nav:hover { background: var(--paper); }
.rail a.nav[aria-current="page"] { background: var(--paper); font-weight: 700; }
.rail a.nav[aria-current="page"]::before { width: 22px; }
.rail a.nav .count { margin-left: auto; font-size: .8rem; color: var(--ink-3); }
.rail .spacer { flex: 1; }
.rail .add-subject { margin: 6px 22px; }
.menu-btn { display: none; }

main { padding: 36px clamp(16px, 4vw, 56px) 80px; max-width: 1100px; width: 100%; outline: none; }

/* Buttons & Inputs */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 42px; padding: 8px 18px; border-radius: var(--radius-s);
  border: 1.5px solid var(--ink); background: var(--sheet); color: var(--ink);
  font: 650 .97rem var(--font-ui); cursor: pointer; text-decoration: none; white-space: nowrap;
  box-shadow: 0 2px 0 var(--ink);
  transition: transform .08s, box-shadow .08s;
}
.btn:hover { background: var(--paper); }
.btn:active { transform: translateY(2px); box-shadow: 0 0 0 var(--ink); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: 0 2px 0 var(--blue-press); }
:root[data-theme="dark"] .btn.primary { color: #0F1530; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0F1530; } }
.btn.primary:hover { filter: brightness(1.06); background: var(--blue); }
.btn.ghost { border-color: transparent; box-shadow: none; background: transparent; color: var(--blue); padding-inline: 10px; }
.btn.ghost:hover { background: color-mix(in srgb, var(--blue) 8%, transparent); }
.btn.danger { color: var(--red); border-color: var(--red); box-shadow: 0 2px 0 var(--red); }
.btn.small { min-height: 34px; padding: 4px 12px; font-size: .88rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.stack { display: grid; gap: 14px; }

label.field { display: grid; gap: 6px; font: 600 .92rem var(--font-ui); }
input[type="text"], input[type="date"], input[type="number"], input[type="search"], select, textarea {
  width: 100%; padding: 10px 12px; border-radius: var(--radius-s);
  border: 1.5px solid var(--rule); background: var(--sheet); font-family: var(--font-body); font-size: 1rem;
}
input:focus, select:focus, textarea:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 22%, transparent); }
textarea { min-height: 140px; resize: vertical; line-height: 1.5; }

/* Seitenkopf */
.page-head { display: grid; gap: 10px; margin-bottom: 28px; }
.crumbs { font: 500 .9rem var(--font-ui); color: var(--ink-3); }
.crumbs a { color: var(--ink-2); text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
.head-row { display: flex; gap: 16px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
.margin-note { font-family: var(--font-hand); font-size: 1.6rem; color: var(--red); line-height: 1; transform: rotate(-2deg); display: inline-block; }
.margin-note.blue { color: var(--blue); }

/* Blätter (Flächen) */
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius-m); box-shadow: var(--shadow); }
.pad { padding: 22px; }
section + section { margin-top: 36px; }
.section-title { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; }

/* Übersicht */
.today { display: grid; grid-template-columns: 1.3fr 1fr; gap: 22px; align-items: stretch; }
.agenda { padding: 6px 0; }
.agenda li { list-style: none; display: grid; grid-template-columns: 76px 1fr auto; gap: 14px; align-items: center; padding: 12px 22px; border-top: 1px dashed var(--rule); }
.agenda li:first-child { border-top: 0; }
.agenda ul { margin: 0; padding: 0; }
.date-chip { text-align: center; line-height: 1.05; font-family: var(--font-ui); }
.date-chip b { display: block; font-size: 1.6rem; font-weight: 800; }
.date-chip span { font-size: .8rem; color: var(--ink-2); }
.agenda a { color: var(--ink); text-decoration: none; font-weight: 700; }
.agenda a:hover { text-decoration: underline; }
.due-box { padding: 22px; display: grid; gap: 14px; align-content: start; }
.due-num { font: 800 3.4rem/1 var(--font-ui); letter-spacing: -.03em; }
.subjects { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
.subject-tile { position: relative; display: grid; gap: 6px; padding: 20px 20px 18px 20px; text-decoration: none; color: var(--ink); overflow: hidden; }
.subject-tile::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 8px; background: var(--c); }
.subject-tile h3 { font-size: 1.2rem; }
.subject-tile:hover { border-color: var(--ink-3); }
.bar { height: 8px; border-radius: 99px; background: var(--grid); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); border-radius: inherit; }

/* Fach-Seite: Tests */
.tests { display: grid; gap: 14px; }
.test-row { display: grid; grid-template-columns: 1fr auto; gap: 8px 18px; align-items: center; padding: 18px 22px; text-decoration: none; color: var(--ink); }
.test-row:hover { border-color: var(--ink-3); }
.test-row .meta { color: var(--ink-2); font-size: .92rem; }

/* Tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1.5px solid var(--rule); margin-bottom: 26px; overflow-x: auto; scrollbar-width: none; }
.tabs a { padding: 10px 14px; text-decoration: none; color: var(--ink-2); font: 600 .97rem var(--font-ui); border-bottom: 3px solid transparent; margin-bottom: -1.5px; white-space: nowrap; }
.tabs a[aria-current="page"] { color: var(--ink); border-color: var(--ink); }
.tabs a:hover { color: var(--ink); }

/* Lernmodi */
.modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.mode { display: grid; grid-template-rows: auto auto 1fr auto; gap: 6px; padding: 18px 20px; text-align: left; cursor: pointer; text-decoration: none; color: var(--ink); }
.mode:hover { border-color: var(--ink-3); }
.mode .ico { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 8px; background: color-mix(in srgb, var(--c) calc(var(--mark-a) * 100%), transparent); margin-bottom: 6px; }
.mode .ico svg { width: 24px; height: 24px; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.mode p { color: var(--ink-2); font-size: .93rem; }
.mode .n { font: 600 .85rem var(--font-ui); color: var(--ink-3); margin-top: 8px; }
.mode[aria-disabled="true"] { opacity: .5; pointer-events: none; }
.mode.feature { grid-column: span 2; background: var(--ink); color: var(--paper); border-color: var(--ink); }
.mode.feature p, .mode.feature .n { color: color-mix(in srgb, var(--paper) 75%, transparent); }
.mode.feature .ico svg { stroke: var(--ink); }

.plan { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.plan .day { flex: 0 0 auto; min-width: 74px; padding: 10px 8px; text-align: center; border: 1px dashed var(--rule); border-radius: var(--radius-s); background: var(--sheet); font-size: .82rem; }
.plan .day b { display: block; font: 700 1.05rem var(--font-ui); }
.plan .day.is-today { border: 2px solid var(--blue); }
.plan .day.exam { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* Material */
.drop { display: grid; place-items: center; gap: 10px; padding: 34px 20px; text-align: center; border: 2px dashed var(--ink-3); border-radius: var(--radius-m); background: var(--sheet); cursor: pointer; }
.drop.over { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 6%, var(--sheet)); }
.drop svg { width: 46px; height: 46px; stroke: var(--ink-2); fill: none; stroke-width: 1.6; }
.doc-list { display: grid; gap: 10px; }
.doc { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; padding: 14px 18px; }
.doc .kind { font: 700 .74rem var(--font-ui); padding: 4px 8px; border-radius: 4px; background: var(--grid); color: var(--ink-2); text-transform: uppercase; }
.progress-line { display: grid; gap: 6px; padding: 14px 18px; }

/* Kartenliste */
.card-list { display: grid; gap: 10px; }
.card-item { display: grid; grid-template-columns: 1fr 1fr auto; gap: 16px; padding: 14px 18px; align-items: start; }
.card-item .q { font-weight: 700; }
.card-item .t { font: 600 .76rem var(--font-ui); color: var(--ink-3); display: block; margin-bottom: 2px; }
.card-item textarea { min-height: 70px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.chip { border: 1.5px solid var(--rule); background: var(--sheet); border-radius: 99px; padding: 4px 12px; font: 600 .85rem var(--font-ui); cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }

/* Spickzettel */
.cheat { padding: 30px 34px; background-image: linear-gradient(var(--sheet), var(--sheet)); position: relative; }
.cheat::before { content: ''; position: absolute; top: 0; bottom: 0; left: 22px; width: 2px; background: color-mix(in srgb, var(--red) 55%, transparent); }
.cheat > * { margin-left: 18px; }
.terms { display: flex; flex-wrap: wrap; gap: 8px 12px; margin: 12px 0 24px 18px; }
.cheat ol { padding-left: 1.2em; display: grid; gap: 10px; max-width: 72ch; }
.glossary { display: grid; grid-template-columns: minmax(140px, max-content) 1fr; gap: 8px 22px; margin: 14px 0 26px 18px; max-width: 80ch; }
.glossary dt { font-weight: 700; }
.glossary dd { margin: 0; color: var(--ink-2); }

/* Lern-Sitzung */
.session { max-width: 760px; margin: 0 auto; display: grid; gap: 22px; }
.session-top { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; }
.session-top .bar { height: 10px; }
.counter { font: 700 .95rem var(--font-ui); color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* Karteikarte */
.flash { perspective: 1400px; cursor: pointer; }
.flash-inner { position: relative; min-height: 340px; transition: transform .5s cubic-bezier(.3,.7,.2,1); transform-style: preserve-3d; }
.flash.flipped .flash-inner { transform: rotateX(180deg); }
.face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: #FFFEF8; color: #1A2550; border-radius: 4px; box-shadow: 0 2px 0 #d9dbe6, 0 18px 40px -18px rgba(26,37,80,.45);
  padding: 58px 40px 34px; display: grid; align-content: center; gap: 14px; text-align: center;
  background-image: linear-gradient(transparent 0 40px, #E8545F 40px 42px, transparent 42px), repeating-linear-gradient(transparent 0 33px, #BFD4F2 33px 34px);
  background-position: 0 0, 0 42px;
}
.face.back { transform: rotateX(180deg); }
.face .type { position: absolute; top: 11px; left: 18px; font: 600 .8rem var(--font-ui); color: #7480A0; }
.face .hint { position: absolute; bottom: 12px; left: 0; right: 0; font-size: .82rem; color: #7480A0; }
.face .front-text { font: 700 clamp(1.25rem, 3vw, 1.8rem)/1.3 var(--font-ui); }
.face .back-text { font: 400 clamp(1.05rem, 2.4vw, 1.3rem)/1.5 var(--font-body); }
.face .back-q { font-size: .9rem; color: #4B567A; }
.answer-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.answer-row .btn { min-height: 54px; font-size: 1.02rem; }
.btn.know { border-color: var(--ok); color: var(--ok); box-shadow: 0 2px 0 var(--ok); }
.btn.dont { border-color: var(--red); color: var(--red); box-shadow: 0 2px 0 var(--red); }
.boxes { display: flex; gap: 6px; justify-content: center; }
.boxes span { width: 34px; height: 8px; border-radius: 3px; background: var(--grid); }
.boxes span.on { background: var(--ok); }
kbd { font: 600 .78rem var(--font-ui); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--sheet); }

/* Quiz */
.question { padding: 28px 30px; display: grid; gap: 22px; }
.question .qtext { font: 650 1.3rem/1.4 var(--font-ui); }
.question .qtext .gap { display: inline-block; min-width: 5em; border-bottom: 2.5px solid var(--ink); }
.opts { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: center; text-align: left;
  padding: 12px 16px; border: 1.5px solid var(--rule); border-radius: var(--radius-s); background: var(--sheet); cursor: pointer; font-size: 1rem;
}
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt .key { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; border: 1.5px solid var(--ink-3); font: 700 .85rem var(--font-ui); }
.opt.right { border-color: var(--ok); background: color-mix(in srgb, var(--m-gruen) calc(var(--mark-a) * 70%), var(--sheet)); }
.opt.wrong { border-color: var(--red); background: color-mix(in srgb, var(--m-pink) calc(var(--mark-a) * 60%), var(--sheet)); }
.opt:disabled { cursor: default; }
.feedback { padding: 14px 18px; border-radius: var(--radius-s); border-left: 5px solid; }
.feedback.ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 9%, var(--sheet)); }
.feedback.no { border-color: var(--red); background: color-mix(in srgb, var(--red) 8%, var(--sheet)); }
.feedback .src { margin-top: 6px; font-size: .9rem; color: var(--ink-2); }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tf .btn { min-height: 60px; font-size: 1.1rem; }

/* Zuordnen */
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; }
.match .col { display: grid; gap: 10px; align-content: start; }
.tile { padding: 12px 14px; border: 1.5px solid var(--rule); border-radius: var(--radius-s); background: var(--sheet); cursor: pointer; text-align: left; font-size: .97rem; line-height: 1.35; }
.tile:hover:not(:disabled) { border-color: var(--ink); }
.tile.sel { border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 22%, transparent); }
.tile.done { border-color: transparent; background: color-mix(in srgb, var(--c, var(--m-gruen)) calc(var(--mark-a) * 100%), var(--sheet)); cursor: default; }
.tile.shake { animation: shake .35s; border-color: var(--red); }
@keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

/* Ergebnis */
.result { padding: 34px; display: grid; gap: 18px; text-align: center; justify-items: center; }
.grade { font: 700 6rem/0.9 var(--font-hand); color: var(--red); transform: rotate(-6deg); }
.review { display: grid; gap: 10px; text-align: left; width: 100%; }
.review .item { padding: 12px 16px; border-left: 4px solid var(--red); background: var(--paper); border-radius: 4px; }
.review .item.ok { border-color: var(--ok); }
table.results { width: 100%; border-collapse: collapse; }
table.results th, table.results td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--rule); }
table.results th { font: 600 .85rem var(--font-ui); color: var(--ink-3); }

/* Leerer Zustand */
.empty { padding: 40px 30px; display: grid; gap: 16px; justify-items: start; max-width: 640px; }
.empty .margin-note { font-size: 1.9rem; }

/* Dialog, Toast */
dialog { border: 1px solid var(--rule); border-radius: var(--radius-m); padding: 0; background: var(--sheet); color: var(--ink); width: min(560px, calc(100vw - 32px)); box-shadow: 0 30px 80px -20px rgba(0,0,0,.45); }
dialog::backdrop { background: rgba(18, 26, 51, .45); }
dialog form { padding: 24px; display: grid; gap: 16px; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatches label { position: relative; cursor: pointer; }
.swatches input { position: absolute; opacity: 0; }
.swatches span { display: block; width: 38px; height: 38px; border-radius: 8px; background: var(--c); border: 2px solid transparent; }
.swatches input:checked + span { border-color: var(--ink); box-shadow: inset 0 0 0 3px var(--sheet); }
.swatches input:focus-visible + span { outline: 3px solid var(--blue); outline-offset: 2px; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 140%); background: var(--ink); color: var(--paper); padding: 12px 20px; border-radius: 8px; font: 600 .95rem var(--font-ui); transition: transform .25s; z-index: 50; max-width: calc(100vw - 32px); }
#toast.show { transform: translate(-50%, 0); }
.filewarn { max-width: 620px; margin: 10vh auto; display: grid; gap: 14px; }
.note { padding: 14px 18px; border-radius: var(--radius-s); background: color-mix(in srgb, var(--m-gelb) calc(var(--mark-a) * 45%), var(--sheet)); border: 1px solid color-mix(in srgb, var(--m-gelb) 70%, var(--rule)); font-size: .95rem; }
pre.prompt { white-space: pre-wrap; font-size: .85rem; background: var(--paper); padding: 12px; border-radius: 6px; border: 1px solid var(--rule); max-height: 220px; overflow: auto; }

/* Mobil */
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .rail { position: fixed; z-index: 40; inset: 0 auto 0 0; width: 280px; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow); }
  .rail.open { transform: none; }
  .menu-btn { display: inline-flex; position: fixed; top: 12px; right: 12px; z-index: 45; }
  main { padding-top: 64px; }
  .today { grid-template-columns: 1fr; }
  .mode.feature { grid-column: auto; }
  .card-item { grid-template-columns: 1fr; }
  .match { gap: 10px; }
  .face { padding: 54px 20px 34px; }
  .agenda li { grid-template-columns: 60px 1fr; padding: 12px 16px; }
  .agenda li > :last-child { grid-column: 2; }
  .glossary { grid-template-columns: 1fr; gap: 2px; }
  .glossary dd { margin-bottom: 10px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
@media print {
  body { background: #fff; }
  .rail, .tabs, .no-print, .menu-btn, .page-head .row { display: none !important; }
  .shell { display: block; }
  main { padding: 0; max-width: none; }
  .sheet { box-shadow: none; border: 0; }
}
.btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; flex: none; }
.chip input { accent-color: var(--blue); }
[hidden] { display: none !important; }
.btn.menu-btn { display: none; }
@media (max-width: 860px) { .btn.menu-btn { display: inline-flex; position: fixed; top: 12px; right: 12px; z-index: 45; } }
.face .back-q .mk { font-weight: 700; }
#toast:not(.show) { visibility: hidden; transition: transform .25s, visibility 0s .25s; }
.btn.star.on { color: var(--red); }
.filters .chip.star-chip[aria-pressed="true"] { background: var(--red); border-color: var(--red); }
.subject-tile h3, .rail a.nav, .test-row h3 { hyphens: auto; overflow-wrap: anywhere; }
dialog.wide { width: min(820px, calc(100vw - 32px)); }
.reader-text { max-height: 68vh; overflow-y: auto; display: grid; gap: 14px; max-width: 72ch; line-height: 1.7; padding-right: 8px; }
.face { overflow-y: auto; align-content: safe center; overscroll-behavior: contain; }
.face .back-text.long { font-size: 1rem; text-align: left; line-height: 1.55; }

/* Handy-Version – Design nach Vorlage DESIGN.webp: weiß, weiche Karten, Verlaufs-Karte, Pastell-Kacheln, Pill-Buttons. Akzent Hellblau. */
:root {
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --soft: #F4F6FA;
  --line: #E7EAF0;
  --text: #1B1E2B;
  --text-2: #6A6F80;
  --text-3: #9BA1B0;
  --accent: #3A98EE;
  --accent-strong: #2381DA;
  --accent-soft: #E9F4FE;
  --accent-line: #BCDDFB;
  --on-accent: #FFFFFF;
  --hero: linear-gradient(140deg, #9AD0FF 0%, #5EAFF6 52%, #3C93EA 100%);
  --t-blau: #EAF4FF; --t-blau-i: #CBE5FF;
  --t-gelb: #FFF6D8; --t-gelb-i: #FFE59A;
  --t-gruen: #E7F8ED; --t-gruen-i: #BFEFD0;
  --t-pink: #FFECF3; --t-pink-i: #FFCADF;
  --t-orange: #FFF1E3; --t-orange-i: #FFD6AE;
  --card-shadow: 0 1px 2px rgba(27, 30, 43, .04), 0 6px 16px -8px rgba(27, 30, 43, .14);
  --r-l: 18px; --r-m: 14px; --r-s: 10px;
  /* Lern-Bildschirme (app.css) auf dieselben Farben umstellen */
  --paper: var(--bg); --sheet: var(--surface); --grid: var(--soft); --rule: var(--line);
  --ink: var(--text); --ink-2: var(--text-2); --ink-3: var(--text-3);
  --blue: var(--accent); --blue-press: var(--accent-strong);
  --m-lila: #9CCBFF;
  --font-ui: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-body: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --radius-s: 10px; --radius-m: 16px;
  --shadow: var(--card-shadow);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E131D; --surface: #161C29; --soft: #1C2333; --line: #273044;
    --text: #EDF0F6; --text-2: #A5ADBF; --text-3: #7C859A;
    --accent: #6DB8FF; --accent-strong: #8CC7FF; --accent-soft: #18283D; --accent-line: #2C4C70; --on-accent: #08131F;
    --hero: linear-gradient(140deg, #3D7FC4 0%, #2D69AD 55%, #22558F 100%);
    --t-blau: #172638; --t-blau-i: #24405E; --t-gelb: #2A2618; --t-gelb-i: #4A4020;
    --t-gruen: #16291F; --t-gruen-i: #1F4A33; --t-pink: #2C1A24; --t-pink-i: #4E2A3C;
    --t-orange: #2C2117; --t-orange-i: #4E3620;
    --card-shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 18px -10px rgba(0,0,0,.6);
    --paper: var(--bg); --sheet: var(--surface); --grid: var(--soft); --rule: var(--line);
    --ink: var(--text); --ink-2: var(--text-2); --ink-3: var(--text-3); --blue: var(--accent); --blue-press: var(--accent-strong);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E131D; --surface: #161C29; --soft: #1C2333; --line: #273044;
  --text: #EDF0F6; --text-2: #A5ADBF; --text-3: #7C859A;
  --accent: #6DB8FF; --accent-strong: #8CC7FF; --accent-soft: #18283D; --accent-line: #2C4C70; --on-accent: #08131F;
  --hero: linear-gradient(140deg, #3D7FC4 0%, #2D69AD 55%, #22558F 100%);
  --t-blau: #172638; --t-blau-i: #24405E; --t-gelb: #2A2618; --t-gelb-i: #4A4020;
  --t-gruen: #16291F; --t-gruen-i: #1F4A33; --t-pink: #2C1A24; --t-pink-i: #4E2A3C;
  --t-orange: #2C2117; --t-orange-i: #4E3620;
  --card-shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 18px -10px rgba(0,0,0,.6);
  --paper: var(--bg); --sheet: var(--surface); --grid: var(--soft); --rule: var(--line);
  --ink: var(--text); --ink-2: var(--text-2); --ink-3: var(--text-3); --blue: var(--accent); --blue-press: var(--accent-strong);
  color-scheme: dark;
}

html, body { min-height: 100%; }
body { background: var(--bg); background-image: none; color: var(--text); font: 15px/1.5 var(--font-body); letter-spacing: -.005em; }
h1, h2, h3 { font-family: var(--font-ui); letter-spacing: -.02em; }
h1 { font-size: 1.35rem; font-weight: 700; }
h2 { font-size: 1.12rem; font-weight: 700; }
#main {
  max-width: 560px; margin: 0 auto;
  padding: 14px 18px calc(92px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 18px; align-content: start;
}
body.in-session #main { padding-bottom: 28px; }
#main > section, .tabbody > section { display: grid; gap: 12px; margin: 0; }
#main > section + section { margin-top: 0; }
.muted { color: var(--text-2); }
.section-label { font: 700 1.02rem var(--font-ui); color: var(--text); margin-bottom: -2px; }

/* Knöpfe */
.btn { border-radius: 999px; box-shadow: none; border: 1px solid var(--line); background: var(--surface); color: var(--text); font: 600 .95rem var(--font-ui); min-height: 44px; }
.btn:hover { background: var(--soft); }
.btn:active { transform: scale(.98); box-shadow: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); box-shadow: none; }
.btn.primary:hover { background: var(--accent-strong); filter: none; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
.btn.danger { color: #E5484D; border-color: #F5C2C4; box-shadow: none; }
.btn.big { min-height: 52px; font-size: 1rem; width: 100%; }
.btn.wide { width: 100%; }
.btn.small { min-height: 34px; }
.danger-text { color: #E5484D; }
.pill { display: inline-flex; align-items: center; justify-content: center; padding: 6px 12px; border-radius: 999px; background: var(--accent-soft); border: 1px solid var(--accent-line); color: var(--accent-strong); font: 600 .78rem var(--font-ui); white-space: nowrap; }
.icon-btn { position: relative; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text); text-decoration: none; cursor: pointer; flex: none; }
.icon-btn.plain { border-color: transparent; background: transparent; width: 38px; }
.icon-btn svg, .arrow-btn svg, .search svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn .dot { position: absolute; top: -5px; right: -5px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 99px; background: #E5484D; color: #fff; font: 700 .7rem/20px var(--font-ui); text-align: center; }

/* Kopf Startseite */
.top { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding-top: 4px; }
.avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--hero); color: #fff; font: 800 1.1rem var(--font-ui); }
.hello { display: grid; line-height: 1.2; }
.hello small { color: var(--text-2); font-size: .8rem; }
.hello b { font: 700 1.12rem var(--font-ui); }
.search { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; padding: 0 14px; height: 46px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--text-3); }
.search input { border: 0; padding: 0; background: transparent; height: 100%; font-size: .92rem; box-shadow: none !important; }
.home-body { display: grid; gap: 22px; }

/* Verlaufs-Karte */
.hero-card { position: relative; overflow: hidden; display: grid; gap: 4px; padding: 18px; border-radius: var(--r-l); background: var(--hero); color: #fff; }
.hero-card::before, .hero-card::after { content: ''; position: absolute; border-radius: 50%; background: rgba(255,255,255,.14); pointer-events: none; }
.hero-card::before { width: 180px; height: 180px; right: -50px; top: -60px; }
.hero-card::after { width: 120px; height: 120px; right: 40px; top: 40px; background: rgba(255,255,255,.09); }
.hero-chip { justify-self: start; display: inline-flex; gap: 6px; align-items: center; padding: 6px 12px; border-radius: 999px; background: #fff; color: #1B1E2B; font: 600 .8rem var(--font-ui); text-decoration: none; margin-bottom: 10px; position: relative; z-index: 1; }
.hero-label { font-size: .82rem; opacity: .92; position: relative; }
.hero-title { font: 700 1.02rem/1.35 var(--font-ui); margin-bottom: 12px; position: relative; text-wrap: balance; }
.slider { position: relative; height: 6px; border-radius: 99px; background: rgba(255,255,255,.35); margin: 8px 0 2px; }
.slider i { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: #fff; }
.slider b { position: absolute; top: 50%; width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 3px solid #3C93EA; transform: translate(-50%, -50%); }
.hero-pct { text-align: center; font: 600 .78rem var(--font-ui); margin-bottom: 10px; position: relative; }
.hero-btn { display: flex; justify-content: center; align-items: center; min-height: 44px; border-radius: 999px; background: #fff; color: #1B1E2B; font: 600 .92rem var(--font-ui); text-decoration: none; position: relative; }

/* Pastell-Kacheln */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile-card { --t: var(--t-blau); --ti: var(--t-blau-i); display: grid; align-content: start; gap: 4px; padding: 14px; border-radius: var(--r-m); background: var(--t); color: var(--text); text-decoration: none; text-align: left; border: 0; cursor: pointer; font: inherit; min-height: 170px; }
.tile-card[data-tone="gelb"] { --t: var(--t-gelb); --ti: var(--t-gelb-i); }
.tile-card[data-tone="gruen"] { --t: var(--t-gruen); --ti: var(--t-gruen-i); }
.tile-card[data-tone="pink"] { --t: var(--t-pink); --ti: var(--t-pink-i); }
.tile-card[data-tone="orange"] { --t: var(--t-orange); --ti: var(--t-orange-i); }
.tile-ico { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--ti); font: 800 .8rem var(--font-ui); color: var(--text); margin-bottom: 8px; }
.tile-ico svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tile-card b { font: 700 .98rem/1.25 var(--font-ui); overflow-wrap: anywhere; hyphens: auto; }
.tile-card small { color: var(--text-2); font-size: .8rem; line-height: 1.35; }
.tile-card .pill { justify-self: start; margin-top: auto; background: var(--surface); border-color: transparent; color: var(--text); }
.tile-card.add { background: var(--surface); border: 1.5px dashed var(--line); }
.tile-card.add .tile-ico { background: var(--accent-soft); color: var(--accent-strong); font-size: 1.3rem; }
.tile-card[aria-disabled="true"] { opacity: .45; pointer-events: none; }
.tile-card:active, .item-card:active { transform: scale(.985); }

/* Listenkarten (wie "Module 02") */
.cards { display: grid; gap: 10px; }
.item-card { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 14px 16px; border-radius: var(--r-m); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--card-shadow); color: var(--text); text-decoration: none; }
.item-card .txt { display: grid; gap: 2px; min-width: 0; }
.item-card small { color: var(--text-2); font-size: .76rem; }
.item-card b { font: 700 1rem/1.3 var(--font-ui); overflow-wrap: anywhere; hyphens: auto; }
.item-card .txt > span { color: var(--text-2); font-size: .84rem; }
.item-card.doc .row { flex-wrap: nowrap; gap: 6px; }
.empty-card { grid-template-columns: 1fr; box-shadow: none; background: var(--soft); border-style: dashed; }
details.item-card { display: block; padding: 0; }
details.item-card summary { list-style: none; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 14px 16px; cursor: pointer; }
details.item-card summary::-webkit-details-marker { display: none; }
details.item-card[open] .pill { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.star-a { padding: 0 16px 16px; color: var(--text-2); line-height: 1.6; font-size: .92rem; }

/* Kopf Unterseiten */
.nav-head { display: grid; grid-template-columns: auto 1fr auto; gap: 6px; align-items: center; min-height: 44px; }
.nav-head h1 { font-size: 1.12rem; min-width: 0; overflow-wrap: anywhere; hyphens: auto; }
.nav-head:not(:has(.icon-btn)) { grid-template-columns: 1fr; }
.module-card { display: grid; grid-template-columns: 1fr auto; gap: 12px 14px; align-items: center; padding: 16px; border-radius: var(--r-m); background: var(--accent-soft); border: 1px solid var(--accent-line); }
.module-card .txt { display: grid; gap: 2px; min-width: 0; }
.module-card small { color: var(--text-2); font-size: .76rem; }
.module-card b { font: 700 1.08rem/1.3 var(--font-ui); text-wrap: balance; }
.module-card .txt > span { color: var(--text-2); font-size: .84rem; }
.arrow-btn { width: 44px; height: 40px; display: grid; place-items: center; border-radius: 12px; border: 1.5px solid var(--accent); color: var(--accent-strong); background: var(--surface); text-decoration: none; }
.mbar { grid-column: 1 / -1; height: 5px; border-radius: 99px; background: var(--surface); overflow: hidden; }
.mbar i { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
.exam-card { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 14px; border-radius: var(--r-m); background: var(--hero); color: #fff; text-decoration: none; }
.exam-card .tile-ico { margin: 0; background: rgba(255,255,255,.25); color: #fff; }
.exam-card .txt { display: grid; gap: 2px; }
.exam-card b { font: 700 1rem var(--font-ui); }
.exam-card small { font-size: .8rem; opacity: .9; }
.exam-card .arrow-btn { background: #fff; border-color: #fff; color: #2381DA; }
.exam-card[aria-disabled="true"] { opacity: .45; pointer-events: none; }

/* Reiter im Test */
.seg { display: flex; gap: 4px; padding: 4px; background: var(--soft); border-radius: 12px; overflow-x: auto; scrollbar-width: none; }
.seg a { flex: 1 0 auto; text-align: center; padding: 8px 12px; border-radius: 9px; text-decoration: none; color: var(--text-2); font: 600 .86rem var(--font-ui); white-space: nowrap; }
.seg a[aria-current="page"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(27,30,43,.12); }
.tabbody { display: grid; gap: 18px; }

/* Material, Karten, Spickzettel */
.upload { display: grid; gap: 10px; }
.upload .btn.big { width: 100%; }
.upload .btn svg { width: 18px; height: 18px; }
.progress-line { display: grid; gap: 6px; padding: 14px 16px; border-radius: var(--r-m); }
.bar { background: var(--soft); }
.bar i { background: var(--accent); }
.bar i.indet { width: 35%; animation: indet 1.2s ease-in-out infinite alternate; }
@keyframes indet { from { margin-left: 0; } to { margin-left: 65%; } }
.sheet { border-radius: var(--r-m); border-color: var(--line); box-shadow: var(--card-shadow); }
.pad { padding: 18px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; min-height: 36px; font: 600 .84rem var(--font-ui); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
input[type="text"], input[type="date"], input[type="search"], textarea, select { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.clist { display: grid; gap: 10px; }
.citem { padding: 14px 16px; display: grid; gap: 6px; }
.ctop { display: flex; justify-content: space-between; align-items: center; }
.ctop .t { font: 600 .74rem var(--font-ui); color: var(--text-3); }
.cq { font-weight: 700; }
.ca { color: var(--text-2); }
.citem .btn { justify-self: start; }
.starbtn { border: 0; background: none; font-size: 1.4rem; line-height: 1; color: var(--text-3); cursor: pointer; min-width: 44px; min-height: 44px; margin: -10px -10px -10px 0; }
.starbtn.on { color: #F2A100; }
.cheat { padding: 18px; }
.cheat::before { display: none; }
.cheat > * { margin-left: 0; }
.cheat h3 { margin-top: 8px; font-size: 1rem; }
.terms { margin: 10px 0 18px; }
.glossary { margin: 10px 0 18px; grid-template-columns: 1fr; gap: 2px; }
.glossary dd { margin-bottom: 10px; }
.reader-text .mk, .star-a .mk { --c: var(--t-blau-i); }

/* Tab-Leiste unten */
#tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(3, 1fr);
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
}
#tabbar a { display: grid; justify-items: center; gap: 3px; padding: 4px 0; color: var(--text-3); text-decoration: none; font: 500 .74rem var(--font-ui); }
#tabbar a svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#tabbar a[aria-current="page"] { color: var(--text); font-weight: 700; }
#tabbar a[aria-current="page"] svg { stroke-width: 2.2; }

/* Lern-Bildschirme */
.session { width: 100%; gap: 16px; }
.session h2 { font-size: 1.15rem; }
.flash-inner { min-height: 380px; }
.face {
  background: var(--surface); color: var(--text); background-image: none;
  border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--card-shadow);
  padding: 52px 22px 38px;
}
.face .type, .face .hint { color: var(--text-3); }
.face .type { top: 16px; left: 20px; }
.face .back-q { color: var(--text-2); }
.face.back { background: var(--accent-soft); border-color: var(--accent-line); }
.face .front-text { font-size: clamp(1.15rem, 5vw, 1.45rem); }
.face .front-text span[style] { border-bottom-color: var(--text) !important; }

  return scored.sort((a, b) => b.sc - a.sc).slice(0, n).sort((a, b) => a.i - b.i).map((x) => x.s);
}

// Hauptfunktion: liefert Kartenvorschläge {type, q, a, source}
function generate(rawText, { highlights = [] } = {}) {
  const text = normalize(rawText);
  const lines = text.split('\n').map((l) => l.trim());
  const cards = [];
  const push = (type, q, a, source = '') => {
    q = clean(q); a = clean(a);
    if (q.length < 2 || a.length < 1 || q.toLowerCase() === a.toLowerCase()) return;
    cards.push({ type, q, a, source });
  };

  // 1) Fragen mit Antworten (Arbeitsblatt): Zeile endet mit "?" oder ist ein Arbeitsauftrag ("Nenne 8 …")
  const sents = sentences(text);
  const answerLines = new Set();
  const isTask = (s) => /\?\s*$/.test(s) || TASK.test(s);
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i].replace(/^(\d+|[a-z])[.)]\s*/, '');
    if (!isTask(l) || l.length < 8) continue;
    const ans = [];
    for (let j = i + 1; j < lines.length && ans.length < 6; j++) {
      const n = lines[j];
      if (!n) { if (ans.length) break; else continue; }
      if (isTask(n) || /^\d+[.)]\s+\S/.test(n)) break;
      ans.push(n.replace(/^[>•\-*]\s*/, ''));
    }
    ans.forEach((x) => answerLines.add(x));
    if (ans.length) {
      push('frage', l, ans.join('; '));
      const need = neededCount(l);
      if (need && cards.at(-1)?.q === clean(l)) cards.at(-1).need = need;
    }
    else {
      const best = bestSentenceFor(l, sents);
      if (best) push('frage', l, best, 'Antwort aus dem Text vorgeschlagen');
    }
  }

  // 2) Begriff – Erklärung (Glossare, Vokabeln, Tabellen)
  lines.forEach((raw, i) => {
    const l = raw.replace(/^([a-z]|\d+)[.)]\s*/, '');
    if (isTask(l) || answerLines.has(raw.replace(/^[>•\-*]\s*/, ''))) return;
    const m = l.match(/^([^:=–—\t]{2,60}?)\s*(:|=|\s[–—-]\s|\t+|\s->\s)\s*(.{2,300})$/);
    if (!m) return;
    const term = clean(m[1]), expl = clean(m[3]);
    const strong = /[:=\t]/.test(m[2]);
    // Fließtext-Zeilen mit Gedankenstrich sind keine Begriffspaare
    const prev = lines[i - 1] || '';
    const inProse = prev.length > 50 && !/[.:!?]$/.test(prev) && l.length > 50;
    if (!strong && (inProse || /^(Der|Die|Das|Ein|Eine|Im|In|Als|Wenn|Doch|Und)\s+[a-zäöüß]/.test(term))) return;
    if (m[2] === ':' && /\d$/.test(term)) return; // Uhrzeiten, Bibelstellen
    if (term.split(' ').length > 6 || /^(http|www)/i.test(term) || /[.!]$/.test(term)) return;
    if (/^(quelle|datum|name|klasse|thema|eintrag|seite|autor|lehrer)$/i.test(term) || /^quelle\b/i.test(expl)) return;
    push('begriff', term, expl);
  });

  // 3) Definitionssätze
  for (const s of sents) {
    if (s.length > 260 || /\?$/.test(s)) continue;
    let m = s.match(/^Unter (.{2,60}?) versteht man (.+?)[.!]?$/i);
    if (m) { push('definition', `Was versteht man unter ${m[1]}?`, cap1(m[2]), s); continue; }
    m = s.match(/^(.{2,60}?) (?:wird|werden) (?:als|auch) (.{2,80}?) bezeichnet[.!]?$/);
    if (m) { push('definition', `Wie wird ${m[1].replace(/^(Der|Die|Das|Ein|Eine) /, (x) => x.toLowerCase())} bezeichnet?`, cap1(m[2]), s); continue; }
    m = s.match(/^((?:Der|Die|Das|Ein|Eine) [A-ZÄÖÜ][\wäöüß-]+(?: [a-zäöüß]+ [A-ZÄÖÜ][\wäöüß-]+)?|[A-ZÄÖÜ][\wäöüß-]{3,}(?: \([^)]+\))?) (ist|sind|bezeichnet|bedeutet|beschreibt|meint|umfasst) (.{8,200}?)[.!]?$/);
    if (m && !STOP.has(m[1].toLowerCase())) {
      const subj = m[1];
      const q = m[2] === 'sind' ? `Was sind ${subj.replace(/^Die /, 'die ')}?` : `Was ${m[2] === 'ist' ? 'ist' : m[2]} ${subj.replace(/^(Der|Die|Das|Ein|Eine) /, (x) => x.toLowerCase())}?`;
      push('definition', q, cap1(m[3]), s);
    }
  }

  // 4) Abkürzungen: "Industrie- und Handelskammer (IHK)"
  const abbr = /((?:[A-ZÄÖÜ][\wäöüß-]*[\s-]+(?:und\s+|für\s+|der\s+|des\s+)?){1,5})\(([A-ZÄÖÜ]{2,6})\)/g;
  for (const m of text.matchAll(abbr)) {
    const ab = m[2];
    const ws = clean(m[1]).split(/\s+/);
    const content = (arr) => arr.filter((w) => !/^(und|für|der|des)$/.test(w)).length;
    let start = -1;
    for (let i = ws.length - 1; i >= 0; i--) {
      if (ws[i][0] !== ab[0] || ws[i] === ab) continue;
      start = i;
      if (content(ws.slice(i)) >= Math.min(2, ab.length - 1)) break;
    }
    if (start < 0) continue;
    const full = ws.slice(start).join(' ');
    if (full.length > 4) push('abkuerzung', `Wofür steht die Abkürzung „${ab}“?`, full);
  }

  // 5) Lückentexte aus wichtigen Sätzen
  const kws = keywords(text, highlights, 50);
  const kwSet = kws.map((k) => k.toLowerCase());
  let clozeCount = 0;
  const maxCloze = Math.min(60, Math.max(10, Math.round(sents.length * 0.6)));
  for (const s of sents) {
    if (clozeCount >= maxCloze) break;
    const wc = s.split(' ').length;
    if (wc < 6 || wc > 45 || isTask(s)) continue;
    if ([...answerLines].some((a) => a.includes(s) || s.includes(a))) continue; // Antworten sind schon Frage-Karten
    const lower = s.toLowerCase();
    let pick = null;
    for (let k = 0; k < kws.length; k++) {
      const idx = lower.indexOf(kwSet[k]);
      if (idx > 0 && /[^A-Za-zÄÖÜäöüß]/.test(lower[idx - 1] || ' ') && !/[A-Za-zÄÖÜäöüß-]/.test(lower[idx + kwSet[k].length] || ' ')) {
        pick = s.substr(idx, kws[k].length); break;
      }
    }
    if (!pick) continue;
    const q = s.replace(pick, '_____');
    push('lueckentext', q, pick, s);
    clozeCount++;
  }

  // 6) Jahreszahlen / Zeitangaben
  for (const s of sents) {
    const m = s.match(/\b(1[0-9]{3}|20[0-9]{2}|\d{1,2}\. Jahrhundert(?:s)?)\b/);
    if (!m || s.length > 220 || s.split(' ').length < 6) continue;
    if (cards.some((c) => c.type === 'lueckentext' && c.source === s && c.a === m[1])) continue;
    push('zeit', s.replace(m[1], '_____'), m[1], s);
  }

  // 7) Markierte Stellen → Kontextfrage
  for (const h of highlights) {
    const hk = clean(h);
    if (hk.split(' ').length > 8) continue;
    const s = sents.find((x) => x.includes(hk));
    if (s && !cards.some((c) => c.source === s && c.a === hk)) push('markiert', s.replace(hk, '_____'), hk, s);
  }

  // doppelte entfernen
  const seen = new Set();
  return cards.filter((c) => {
    const k = (c.q + '|' + c.a).toLowerCase();
    if (seen.has(k)) return false;
    seen.add(k); return true;
  });
}

// Satz finden, der eine Frage am besten beantwortet (Wortüberlappung)
function bestSentenceFor(question, sents) {
  const qw = words(question).map((w) => w.toLowerCase()).filter((w) => !STOP.has(w) && w.length > 3);
  if (!qw.length) return null;
  let best = null, bestSc = 0;
  for (const s of sents) {
    if (/\?$/.test(s)) continue;
    const lw = s.toLowerCase();
    let sc = 0;
    for (const w of qw) if (lw.includes(w.slice(0, Math.max(4, w.length - 2)))) sc++;
    sc = sc / qw.length;
    if (sc > bestSc) { bestSc = sc; best = s; }
  }
  return bestSc >= 0.5 ? best : null;
}

const TYPE_LABEL = {
  frage: 'Frage', begriff: 'Begriff', definition: 'Definition', abkuerzung: 'Abkürzung',
  lueckentext: 'Lückentext', zeit: 'Zeitangabe', markiert: 'Markiert', manuell: 'Eigene Karte', import: 'Import',
};

// Antwortvergleich für Freitext: tolerant gegenüber Groß/Klein, Umlauten, Tippfehlern
// Aufzählungen ("Nenne 8 …"): wie viele der geforderten Punkte stecken in der Antwort?
function listScore(given, answer, need) {
  const n = (s) => s.toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss').replace(/[^a-z ]/g, ' ').replace(/\s+/g, ' ').trim();
  const items = answer.split(/[,;]|\bund\b/).map(n).filter(Boolean);
  const g = n(given);
  const gw = g.split(' ');
  const found = items.filter((it) => {
    let core = it.split(' ').filter((w) => w.length > 4 && !STOP.has(w) && !/^(richtigen|moment|gute|guten|guter)$/.test(w));
    if (!core.length) core = it.split(' ').filter((w) => w.length > 2);
    return core.length && core.some((w) => gw.some((v) => v === w || (v.length > 4 && w.length > 4 && levenshtein(v.slice(0, w.length + 1), w) <= 1) || v.startsWith(w.slice(0, Math.max(5, w.length - 2))) || (v.length >= 6 && w.startsWith(v))));
  });
  return { found: found.length, need, score: Math.min(1, found.length / need) };
}

function similarity(a, b) {
  const n = (s) => String(s).toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
    .replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
  const x = n(a), y = n(b);
  if (!x || !y) return 0;
  if (x === y) return 1;
  const lev = levenshtein(x, y);
  const charSim = 1 - lev / Math.max(x.length, y.length);
  const tx = new Set(x.split(' ').filter((w) => w.length > 2 && !STOP.has(w)));
  const ty = new Set(y.split(' ').filter((w) => w.length > 2 && !STOP.has(w)));
  let hit = 0;
  for (const w of ty) if ([...tx].some((v) => v === w || (w.length > 4 && levenshtein(v, w) <= 1))) hit++;
  const tokSim = ty.size ? hit / ty.size : 0;
  return Math.max(charSim, tokSim);
}
function levenshtein(a, b) {
  if (a.length > 300 || b.length > 300) return Math.abs(a.length - b.length) + Math.min(a.length, b.length) / 2;
  const v = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let prev = v[0]; v[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const tmp = v[j];
      v[j] = Math.min(v[j] + 1, v[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = tmp;
    }
  }
  return v[b.length];
}

// IHK-Notenschlüssel (Punkte in %)
function gradeFor(pct) {
  if (pct >= 92) return { note: 1, text: 'sehr gut' };
  if (pct >= 81) return { note: 2, text: 'gut' };
  if (pct >= 67) return { note: 3, text: 'befriedigend' };
  if (pct >= 50) return { note: 4, text: 'ausreichend' };
  if (pct >= 30) return { note: 5, text: 'mangelhaft' };
  return { note: 6, text: 'ungenügend' };
}

return { neededCount, normalize, sentences, keywords, keySentences, generate, TYPE_LABEL, listScore, similarity, gradeFor };

        'Verhaltensnormen', 'Grundsatz von Treu und Glauben', 'Gütesiegel', 'praktische Fähigkeiten', 'Warenkunde', 'Recht', 'Geografie', 'Währung',
        'rationale und emotionale Intelligenz', 'Organisationstalent', 'politischen Weitblick', 'Ehre', 'Handelsmonopole', 'Verantwortung für ihre Heimat',

      text: `Eine Frage der Ehre

In Zeiten immer neuer Wirtschafts-Skandale und Krisen feiert der ehrbare Kaufmann eine Renaissance. Woher das traditionelle Leitbild ursprünglich stammt und welche Werte man heute damit verknüpft.

Das Leitbild des ehrbaren Kaufmanns hat eine lange Tradition. Nachweislich seit dem 12. Jahrhundert wurden in Europa bestimmte Tugenden in den Handbüchern der Kaufleute gelehrt. Die Wurzeln liegen im italienischen Venedig und den norddeutschen Städtebund der Hanse. Von dem Handelszentrum im Süden ausgehend verbreitete sich das Leitbild über die Kaufmanns-Vereinigungen im Norden in ganz Europa.

Christoph Lütge, Inhaber des Lehrstuhls für Wirtschaftsethik an der Technischen Universität München, hat sich intensiv mit der Geschichte des ehrbaren Kaufmanns beschäftigt. Die ersten Kaufleute – im frühen Mittelalter noch zu Fuß und zu Wasser unterwegs – lebten demnach auf ihren Reisen gefährlich und mussten hohe Risiken eingehen, weil sie in jeder Stadt fremd und ohne jegliche Reputation waren. „Oftmals begegnete man den Reisenden mit Skepsis oder sie wurden gar als Betrüger verdächtigt“, sagt Lütge. Das erschwerte den Handel beträchtlich. Um das Vertrauen in die Kaufleute zu stärken und die Bedingungen des Wirtschaftens zu verbessern, entstanden mit dem Aufstreben der Städte ab der Mitte des 12. Jahrhunderts vielerorts Kaufmannsgilden und Vereinigungen wie die Hanse. Nach Auskunft des Wissenschaftlers standen sie für spezifische Verhaltensnormen nach dem Grundsatz von Treu und Glauben und fungierten als Gütesiegel.

Bestimmte Fähigkeiten sind gefordert
Joachim Schwalbach, ehemaliger Leiter des Instituts für Management der Humboldt Universität Berlin, hat sich während seiner langjährigen Forschungsarbeit ebenfalls mit dem ehrbaren Kaufmann auseinandergesetzt. Seiner Ansicht nach zeichne dieser sich seit jeher durch eine gute humanistische Grundbildung aus. Darauf aufbauend besitzt er umfassendes Fachwissen und einen gefestigten Charakter, sagt er. „Ein Kaufmann musste über praktische Fähigkeiten verfügen“, erläutert der Betriebswirt die Anforderungen im Mittelalter. Jene seien eine wichtige Basis seines wirtschaftlichen Erfolgs gewesen. „Rechnen, Lesen, Sprachkenntnisse, Bildung in den Bereichen Warenkunde, Recht, Geografie und Währung wurden ergänzt durch ein ausgeprägtes Gewinnstreben, durch rationale und emotionale Intelligenz, Organisationstalent sowie politischen Weitblick“, betont Schwalbach. Doch das allein macht noch keinen ehrbaren Kaufmann aus. Die Ehrbarkeit entstand erst durch tugendhaftes Verhalten. „Bis zum Anbruch der Moderne wurde Ehre als soziales Kapital verstanden, dessen Wert man steigern oder durch schändliches Verhalten verlieren konnte“, sagt Schwalbach. Wer betrog, täuschte oder Pleite machte, verlor seinen guten Ruf und das Vertrauen seiner Kunden, was unweigerlich zu seinem Ruin führte. Schande sei zudem gleichbedeutend mit dem Ausschluss aus der Gemeinschaft gewesen, sagt Schwalbach. So durfte ein schandhafter Kaufmann keine Ämter mehr bekleiden und wurde im schlimmsten Fall aus der Stadt getrieben. Grundlegende Tugenden waren im Mittelalter Ehrlichkeit, Vorsicht, Misstrauen, die Wahrung von Geschäftsgeheimnissen, Wagemut im richtigen Moment, Friedensliebe, Ernsthaftigkeit, Höflichkeit, Klugheit, Ordnung, eine gute Erscheinung und eine gute Erziehung. „Ein ehrbarer Kaufmann tat sich Gutes, indem er ehrbar wirtschaftete und damit seinen eigenen und den Wohlstand der Gemeinschaft mehrte“, erläutert Schwalbach. Dadurch entwickelte sich eine pragmatische Geschäftsmoral des goldenen Mittelwegs mit dem Ziel, den geschäftlichen Erfolg langfristig zu sichern – auch über Generationen hinweg.

Die Rahmenbedingungen ändern sich
Im 15. Jahrhundert gelangten die Kaufleute zu größerem Einfluss. „Die Hanse im Norden oder die Fugger und Welser im Süden von Deutschland bildeten regelrechte Handelsmonopole heraus“, erklärt Lütge. Die Ehrbarkeit spielt hierbei demzufolge eine wichtige Rolle. „Viele Kaufleute fühlten sich ethischen Grundsätzen verpflichtet. Sie folgten nicht nur bei ihren Geschäftsabwicklungen klaren Prinzipien, sondern sie übernahmen auch Verantwortung für ihre Heimat“, sagt der Wirtschaftsethiker der Technischen Universität München. Der Grund: Die Kaufleute wollten ihrer Region etwas zurückgeben, da diese ihren gesellschaftlichen Aufstieg erst ermöglichte.

Im Laufe der Zeit passten sich die ethischen Regeln immer wieder an gewandelte ökonomische Rahmenbedingungen an. „In ihrem Kern blieben die Grundsätze aber unverändert. Sie basieren auf christlichen Werten und standen für Verantwortung“, betont Lütge. Nach Jahrhunderten blühender Handelsbeziehungen folgte der wirtschaftliche Stillstand während des Dreißigjährigen Krieges (1614-1648) und der Niedergang der Hanse. Im 17. und 18. Jahrhundert wandelte sich die Wertvorstellung in der Wirtschaft fundamental. „Im Zuge der Aufklärung trat die Religion als Grundlage des kaufmännischen Ehrverständnisses zugunsten von Vernunft und Moral zurück“, sagt Lütge. Mit dem Beginn der Industrialisierung im 18. Jahrhundert seien die Tugenden des ehrbaren Kaufmanns zunehmend in Vergessenheit geraten. Gesellschaftliches Ansehen erwarb ein Unternehmer demnach nun durch größtmöglichen Reichtum und nicht mehr durch gemeinnütziges Engagement. Anspruch und Wirklichkeit entkoppelten sich auch dadurch, dass Betriebe immer öfter nicht durch Eigentümer, sondern durch angestellte Geschäftsführer geleitet wurden, die dem Druck, immer größere Gewinne zu erzielen, nicht so leicht widerstehen konnten. „In der Folgezeit wurde deutlich, dass diese neuen Maßstäbe Unternehmertum und Gesellschaft stark entzweiten. Das Wirtschaften ohne Verantwortungsübernahme ging vor allem auf Kosten der Arbeitnehmer, was letztlich zu Arbeiteraufständen führte“, erklärt Lütge.

Der Ruf nimmt Schaden

async function extractOffice(file, ext) {

async function readZip(buf) {

  for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--) {

  let p = dv.getUint32(eocd + 16, true);

  for (let i = 0; i < count; i++) {

    names: Object.keys(entries),

async function ocrCanvas(source, onStatus) {

  for (const block of data.blocks || []) for (const para of block.paragraphs) for (const line of para.lines) {

const S = __m.store;
const { generate } = __m.gen;
const { BEISPIEL, FAECHER, KURZARBEIT } = __m.beispiel;

function addGenerated(testId, doc) {
  const gen = generate(doc.text, { highlights: doc.highlights || [] });
  return S.addCards(gen.map((c) => ({ ...c, testId, docId: doc.id })));
}

function addBeispielDoc(testId, bd) {
  const d = S.addDoc(testId, bd.name, bd.kind, bd.text);
  d.highlights = bd.highlights;
  const n = addGenerated(testId, d);
  // Fragen der Kurzarbeit als wichtig markieren
  if (bd === KURZARBEIT) S.get().cards.filter((c) => c.docId === d.id && c.type === 'frage').forEach((c) => { c.star = true; });
  S.save();
  return n;
}

// Legt den Deutsch-Test an; gibt null zurück, wenn er schon existiert
function loadBeispiel() {
  const st = S.get();
  if (st.tests.some((t) => t.title === BEISPIEL.test.title)) return null;
  const s = st.subjects.find((x) => x.name === BEISPIEL.subject.name) || S.addSubject(BEISPIEL.subject.name, BEISPIEL.subject.color);
  const t = S.addTest(s.id, BEISPIEL.test.title, '', BEISPIEL.test.notes);
  for (const bd of BEISPIEL.docs) addBeispielDoc(t.id, bd);
  return t;
}

// Einmalige Einrichtung: Fächer laut Stundenplan, Deutsch-Test, Kurzarbeit-Fragen
function migrate() {
  const st = S.get();
  st.setup ||= {};
  if (!st.setup.faecherV1) {
    const old = st.subjects.find((s) => s.name === 'Deutsch / Kommunikation');
    if (old) old.name = 'D – Deutsch';
    for (const f of FAECHER) if (!st.subjects.some((s) => s.name === f.name)) st.subjects.push({ id: S.uid(), ...f });
    st.setup.faecherV1 = true;
  }
  if (!st.setup.beispielAutoV1) {
    st.setup.beispielAutoV1 = true;
    if (loadBeispiel()) st.setup.kurzarbeitV1 = true;
  }
  if (!st.setup.kurzarbeitV1) {
    const t = st.tests.find((x) => x.title === BEISPIEL.test.title);
    if (t && !S.docsOf(t.id).some((d) => d.name === KURZARBEIT.name)) {
      addBeispielDoc(t.id, KURZARBEIT);
      t.notes = BEISPIEL.test.notes;
    }
    st.setup.kurzarbeitV1 = true;
  }
  // Inhalte auf den Stand der Unterlagen bringen (keine selbst formulierten Antworten mehr)
  if (!st.setup.unterlagenV2) {
    const t = st.tests.find((x) => x.title === BEISPIEL.test.title);
    if (t) {
      t.notes = BEISPIEL.test.notes;
      // Früher automatisch gesetztes Datum (Anlage + 9 Tage) entfernen; selbst eingetragene Daten bleiben
      const auto = new Date(t.createdAt + 9 * 864e5);
      const autoIso = `${auto.getFullYear()}-${String(auto.getMonth() + 1).padStart(2, '0')}-${String(auto.getDate()).padStart(2, '0')}`;
      if (t.date === autoIso) t.date = '';
      for (const bd of BEISPIEL.docs) {
        const d = S.docsOf(t.id).find((x) => x.name === bd.name || (bd.oldNames || []).includes(x.name));
        if (!d || (d.text === bd.text && d.name === bd.name)) continue;
        S.get().cards.filter((c) => c.docId === d.id).forEach((c) => S.deleteCard(c.id));
        S.deleteDoc(d.id);
        addBeispielDoc(t.id, bd);
      }
    }
    st.setup.unterlagenV2 = true;
  }
  S.save();
}

return { addGenerated, addBeispielDoc, loadBeispiel, migrate };
})();
