<head>

<body>
  <a class="skip" href="#main">Zum Inhalt springen</a>
  <div class="shell">
    <aside class="rail" id="rail" aria-label="Fächer"></aside>
    <main id="main" tabindex="-1"></main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog"></dialog>

  <script>
    if (location.protocol === 'file:') {
      document.getElementById('main').innerHTML =
        '<div class="filewarn"><h1>Bitte über „LernApp starten.bat“ öffnen</h1>' +
        '<p>Die App braucht einen kleinen lokalen Server, damit PDF-Lesen und Texterkennung funktionieren. ' +
        'Doppelklicke im Ordner <b>lernapp</b> auf <b>LernApp starten.bat</b>. Danach öffnet sich der Browser automatisch.</p></div>';
    }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
