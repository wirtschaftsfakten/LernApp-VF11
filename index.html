<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LernApp</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F8FBFE">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LernApp">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2338BDF8'/%3E%3Cpath d='M8 10h6a3 3 0 0 1 3 3v10a2 2 0 0 0-2-2H8zM24 10h-6a3 3 0 0 0-3 3v10a2 2 0 0 1 2-2h7z' fill='none' stroke='%2304263F' stroke-width='1.8' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design.css">
  <script>
    // Farbschema vor dem ersten Zeichnen setzen (kein helles Aufblitzen im Dunkelmodus)
    try { document.documentElement.dataset.theme = (JSON.parse(localStorage.getItem('lernapp.v1') || '{}').prefs || {}).theme || 'light'; } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
</head>
<body>
  <a class="skip" href="#main">Zum Inhalt springen</a>
  <div class="app">
    <aside id="side" class="side" aria-label="Navigation"></aside>
    <main id="main" tabindex="-1"></main>
  </div>
  <nav id="bottom" class="bottom-nav" aria-label="Navigation"></nav>
  <div class="scrim" aria-hidden="true"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog"></dialog>

  <script>
    if (location.protocol === 'file:') {
      document.getElementById('main').innerHTML =
        '<div class="filewarn"><h1>Bitte über „LernApp starten.bat“ öffnen</h1>' +
        '<p>Die App braucht einen kleinen lokalen Server, damit PDF-Lesen und Texterkennung funktionieren. ' +
        'Doppelklicke im Ordner <b>lernapp</b> auf <b>LernApp starten.bat</b>.</p></div>';
    }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
